/* Payouts: 1st gets half the pot and the last paid place gets exactly its entry fee back. The other places

function payoutPlaces(n){return n<=7?3:n<=13?4:5}

  const u=[1,.5,.25,.1,.05,.01].find(x=>Math.abs(fee/x-Math.round(fee/x))<1e-6)||.01;

function payouts(n,fee){
  const u=[1,.5,.25,.1,.05,.01].find(x=>Math.abs(fee/x-Math.round(fee/x))<1e-6)||.01;
  const f=Math.round(fee/u),P=n*f,first=Math.round(P/2);
  let k=payoutPlaces(n);
  while(k>2&&P-first-(k-1)*f<0)k--;

}
/* Courts: the games in a round are played at the same time, one per court (court = position in the round).
   Reorder each round's games so nobody gets stuck on one court: pick the order that repeats courts least. */
function assignCourts(rounds,n){
  const seen=Array.from({length:n},()=>({}));
  const perms=a=>a.length<2?[a]:a.flatMap((x,i)=>perms([...a.slice(0,i),...a.slice(i+1)]).map(p=>[x,...p]));
  return rounds.map(R=>{
    let best=null,bs=1e9;
    for(const p of perms(R.map((_,i)=>i))){
      let c=0;
      p.forEach((mi,court)=>[...R[mi].a,...R[mi].b].forEach(x=>{c+=(seen[x][court]||0)**2}));
      c+=Math.random()*0.01;
      if(c<bs){bs=c;best=p}
    }
    const out=best.map(i=>R[i]);
    out.forEach((m,court)=>[...m.a,...m.b].forEach(x=>{seen[x][court]=(seen[x][court]||0)+1}));
    return out;
  });
}
function genSchedule(n,R){
  const b=n%4;               // players sitting out each round
  for(let limit=2;limit<=4;limit++){
    const tries=limit==2?400:300;
    for(let attempt=0;attempt<tries;attempt++){
      const partner=new Set(),opp={},byeCnt=Array(n).fill(0),rounds=[];let ok=true;
      for(let r=0;r<R&&ok;r++){
        let found=null;
        for(let t=0;t<150&&!found;t++){
          let byes=[];
          if(b>0)byes=shuf([...Array(n).keys()]).sort((x,y)=>byeCnt[x]-byeCnt[y]).slice(0,b);
          const pool=shuf([...Array(n).keys()].filter(i=>!byes.includes(i))),teams=[];let bad=false;
          while(pool.length){
            const a=pool.shift();
            const idx=pool.findIndex(c=>!partner.has(a+'-'+c)&&!partner.has(c+'-'+a));
            if(idx<0){bad=true;break}
            teams.push([a,pool.splice(idx,1)[0]]);
          }
          if(bad)continue;
          const ts=shuf(teams),matches=[],cnt={};let good=true;
          for(let i=0;i<ts.length;i+=2){
            for(const x of ts[i])for(const y of ts[i+1]){
              const k1=x+'-'+y;
              if(((opp[k1]||0)+(cnt[k1]||0))>=limit)good=false;
              cnt[k1]=(cnt[k1]||0)+1;cnt[y+'-'+x]=(cnt[y+'-'+x]||0)+1;
            }
            matches.push({a:ts[i],b:ts[i+1],sa:'',sb:''});
          }
          if(good)found={matches,teams,cnt,byes};
        }
        if(!found){ok=false;break}
        found.teams.forEach(([x,y])=>{partner.add(x+'-'+y);partner.add(y+'-'+x)});
        for(const k in found.cnt)opp[k]=(opp[k]||0)+found.cnt[k];
        found.byes.forEach(i=>byeCnt[i]++);
        rounds.push(found.matches);
      }
      if(ok)return assignCourts(rounds,n);
    }
  }
  return null;
}

/* Rounds that give every player the same number of games (sit-outs rotate evenly). */
const gamesEach=(n,r)=>r*(n-n%4)/n;
function roundChoices(n){
  const b=n%4,out=[];
  for(let r=2;r<=n;r++){
    if(b&&(b*r)%n)continue;
    if(gamesEach(n,r)>n-1)continue;   // can't have more distinct partners than other players
    out.push(r);
  }
  const d=defaultRounds(n);
  return out.filter(r=>r<=Math.max(7,d));
}
function defaultRounds(n){
  if(n%4===0)return n===4?3:n/2;
  for(let r=3;r<=n;r++)if((n%4*r)%n===0)return r;
  return n;
}
/* 4-player series: every pair of partners once, in random order, as three best-of-3 series. Each game is its own round
   (one court). The first two games of each series are scheduled; the server adds game 3 only if they split 1-1. */
function genSeries(){
  const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const [p,q,r,t]=sh([0,1,2,3]);
  const pairs=sh([[[p,q],[r,t]],[[p,r],[q,t]],[[p,t],[q,r]]]).map(([x,y])=>Math.random()<.5?[x,y]:[y,x]);
  const out=[];pairs.forEach(([a,b],k)=>[1,2].forEach(g=>out.push([{a,b,sa:'',sb:'',s:k+1,g}])));
  return out;
}
function seriesState(sn){   /* wins for the a side and the b side of series sn, and who has clinched it */
  let wa=0,wb=0,m0=null;
  T.rounds.forEach(r=>r.forEach(m=>{if(m.s!==sn)return;m0=m0||m;if(!filled(m))return;if(+m.sa>+m.sb)wa++;else if(+m.sb>+m.sa)wb++}));
  return {wa,wb,m0,win:wa>=2?'a':wb>=2?'b':null};
}
function standingsSeries(){
  const s=T.players.map((n,i)=>({i,n,pf:0,pa:0,g:0,gw:0,sw:0}));
  T.rounds.forEach(r=>r.forEach(m=>{
    if(!filled(m))return;
    const aw=+m.sa>+m.sb;
    m.a.forEach(i=>{s[i].pf+=+m.sa;s[i].pa+=+m.sb;s[i].g++;if(aw)s[i].gw++});
    m.b.forEach(i=>{s[i].pf+=+m.sb;s[i].pa+=+m.sa;s[i].g++;if(!aw)s[i].gw++});
  }));
  [1,2,3].forEach(n=>{const st=seriesState(n);if(st.win&&st.m0)st.m0[st.win].forEach(i=>s[i].sw++)});
  return s.sort((x,y)=>y.sw-x.sw||y.gw-x.gw);
}
function standings(){
  if(isSeries())return standingsSeries();
  const s=T.players.map((n,i)=>({i,n,pf:0,pa:0,g:0,gw:0}));
  T.rounds.forEach(r=>r.forEach(m=>{
    if(!filled(m))return;
    const aw=+m.sa>+m.sb,bw=+m.sb>+m.sa;
    m.a.forEach(i=>{s[i].pf+=+m.sa;s[i].pa+=+m.sb;s[i].g++;if(aw)s[i].gw++});
    m.b.forEach(i=>{s[i].pf+=+m.sb;s[i].pa+=+m.sa;s[i].g++;if(bw)s[i].gw++});
  }));
  return s.sort((x,y)=>y.pf-x.pf||y.gw-x.gw);
}
/* Ties: players level on the main score (points, or series won in a series) and on total games won share a place.
   Their prize money is pooled and split evenly in whole units of the fee. Any leftover unit goes by a random draw
   that is seeded by the event and the tied players, so every phone shows the same winner of the draw. */
function sameRank(x,y){return isSeries()?x.sw===y.sw&&x.gw===y.gw:x.pf===y.pf&&x.gw===y.gw}
function seedRand(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296}}
function feeUnit(){const fee=+T.fee||0;return [1,.5,.25,.1,.05,.01].find(x=>Math.abs(fee/x-Math.round(fee/x))<1e-6)||.01}
function placed(st,pay){
  const fee=+T.fee||0,u=feeUnit();
  const out=st.map(x=>({...x,pl:0,tie:false,pay:0,odd:false}));
  let a=0;
  while(a<out.length){
    let b=a+1;while(b<out.length&&sameRank(out[a],out[b]))b++;
    const m=b-a,pool=Math.round(pay.slice(a,b).reduce((q,v)=>q+v,0)/u);
    const rnd=seedRand((T.id||T.code||'')+'|'+out.slice(a,b).map(x=>x.i).sort((q,r)=>q-r).join(','));
    const order=out.slice(a,b).map((_,k)=>k).map(k=>[rnd(),k]).sort((q,r)=>q[0]-r[0]).map(q=>q[1]);
    /* nobody is paid less than the entry fee: the pool goes to as many tied players as it can pay at least the fee,
       chosen by the draw, and is split evenly among them (leftover units also by the draw) */
    const fu=Math.max(1,Math.round(fee/u)),w=pool<=0?0:Math.max(1,Math.min(m,Math.floor(pool/fu)));
    for(let k=0;k<m;k++){const e=out[a+k];e.pl=a+1;e.tie=m>1;e.drew=pool>0&&w<m}
    if(w){const base=Math.floor(pool/w),extra=pool-base*w;
      for(let k=0;k<w;k++){const e=out[a+order[k]];e.pay=Math.round((base+(k<extra?1:0))*u*100)/100;e.odd=k<extra&&extra>0&&w>1}}
    a=b;
  }
  return out;
}
const ord=n=>n+(n%10===1&&n!==11?'st':n%10===2&&n!==12?'nd':n%10===3&&n!==13?'rd':'th');
function tieNotes(rows,c){
  const seen={};rows.forEach(x=>{if(x.tie)(seen[x.pl]=seen[x.pl]||[]).push(x)});
  return Object.keys(seen).map(k=>{
    const g=seen[k],names=g.map(x=>esc(x.n)).join(' and '),odd=g.filter(x=>x.odd);
    const paid=c&&g.some(x=>x.pay>0);
    const win=g.filter(x=>x.pay>0);
    const txt=!paid?'Same total and same games won.':g.some(x=>x.drew)?`Prize money can't be split below the entry fee, so ${$$(win.reduce((q,x)=>q+x.pay,0))} goes to <b>${win.map(x=>esc(x.n)).join(' and ')}</b> by random draw.`:'Their prize money is pooled and split evenly'+(odd.length?`; the odd ${$$(feeUnit())} goes to <b>${odd.map(x=>esc(x.n)).join(' and ')}</b> by random draw.`:'.');
    return `<div>Tied for ${ord(+k)}: <b>${names}</b>. ${txt}</div>`}).join('');
}

/* ---------- my stats (from finished events) ---------- */
function myResults(){
  return mine.filter(t=>t.status==='done'&&t.kind!=='open'&&t.money!==false&&Array.isArray(t.result)).map(t=>{
    const i=t.result.findIndex(x=>x.p===prof.id);
    return i<0?null:{t,rank:t.result[i].pl||i+1,n:t.result.length,fee:+t.fee,pay:+t.result[i].pay||0};
  }).filter(Boolean);
}
function statsHTML(){
  const rs=myResults();if(!rs.length)return '';
  const spent=rs.reduce((a,r)=>a+r.fee,0),won=rs.reduce((a,r)=>a+r.pay,0),net=won-spent;
  const roi=spent?Math.round(net/spent*100):0;
  const avg=(rs.reduce((a,r)=>a+r.rank,0)/rs.length).toFixed(1);
  const firsts=rs.filter(r=>r.rank===1).length,cashed=rs.filter(r=>r.pay>0).length;
  const tile=(b,s,c='')=>`<div class="stat"><b class="${c}">${b}</b><span>${s}</span></div>`;
  return `<div class="card"><h2>Your record</h2><div class="stats">
    ${tile(rs.length,'Played')}${tile(firsts,'1st places')}${tile(avg,'Avg finish')}
    ${tile($$(spent),'Spent')}${tile($$(won),'Won')}${tile(money(net),'Net · '+(roi>0?'+':'')+roi+'% ROI',cls(net))}
  </div><div class="note">Cashed in ${cashed} of ${rs.length}. Finished events only.</div></div>`;
}

const validN=n=>isSeries()?n===4:n>=4&&n<=16;
let chosenR=0;
const roundsFor=n=>roundChoices(n).includes(chosenR)?chosenR:defaultRounds(n);
function updateNote(){
  const n=approved().length,w=M.length-n,ok=validN(n),adm=isAdmin();
  if($('pcount'))$('pcount').textContent=n;
  const rb=$('rbox');
  if(rb){
    if(adm&&ok&&!isSeries()){
      if(document.activeElement?.id!=='rsel'){
        const o=roundChoices(n),r=roundsFor(n);
        rb.innerHTML=`<label>Rounds</label><select id="rsel">${o.map(x=>`<option value="${x}"${x===r?' selected':''}>${x} rounds · ${gamesEach(n,x)} games each</option>`).join('')}</select>`;
      }
    }else rb.innerHTML='';
  }
  const el=$('startnote');
  if(el){
    if(!adm)el.textContent='';
    else if(ok&&isSeries()){
      let t='3 series, one for each pairing of partners. Each is best of 3: two games if the same team wins both, a third if they split. That is 6 to 9 games, and everyone plays with everyone once.';
      if(cash()){const p=payoutsFor(n,+T.fee||0);t+=` Pool ${$$(n*(+T.fee||0))} · payouts ${p.map((x,i)=>'#'+(i+1)+' '+$$(x)).join(', ')}.`}
      if(w)t+=` ${w} still waiting will watch as spectators.`;
      el.textContent=t;
    }
    else if(ok){
      const r=roundsFor(n),b=n%4;
      let t=`${r} rounds · everyone plays ${gamesEach(n,r)} games${b?` · ${b} sit out each round`:''}`;
      if(cash()){const p=payoutsFor(n,+T.fee||0);t+=` · pool ${$$(n*(+T.fee||0))} · payouts ${p.map((x,i)=>'#'+(i+1)+' '+$$(x)).join(', ')}`}
      t+='.';
      if(r>7){const alt=[n-1,n+1].filter(m=>validN(m)&&defaultRounds(m)<=7);t+=` That's a long event, because everyone has to play the same number of games.`+(alt.length?` ${alt.join(' or ')} players would be shorter.`:'')}
      if(w)t+=` ${w} still waiting will watch as spectators.`;
      el.textContent=t;
    }else el.textContent=isSeries()?(n<4?`A series needs exactly 4 approved players (${4-n} more).`:`A 4-player rotation needs exactly 4 players. Revoke ${n-4}.`):(n<4?`Need at least 4 approved players (${4-n} more).`:'Max 16 players. Revoke '+(n-16)+'.');
  }
  const b=$('startbtn');if(b)b.disabled=!ok;
  const bn=$('banner');
  if(bn){const me=myMember();bn.textContent=me&&me.approved?(cash()?"You're approved ✓ Waiting for the director to start.":"You're in ✓ Waiting for the director to start."):(cash()?`Waiting for the director to approve you. Pay the ${$$(+T.fee)} entry fee to the director.`:'Waiting for the director to approve you.')}
}

function boardHTML(){
  const rk=rankedNow(),ia=board.filter(x=>x.ranked&&!x.active),pv=board.filter(x=>!x.ranked);
  const dt=d=>{const x=new Date(d),o={month:'short',day:'numeric'};if(x.getFullYear()!==new Date().getFullYear())o.year='numeric';return x.toLocaleDateString(undefined,o)};
  const tbl=(rows,num,cl='')=>`<table class="${cl}"><tr><th>${num?'#':''}</th><th>Player</th><th>Rating</th><th>Games</th><th>Last</th></tr>`+rows.map((x,i)=>`<tr class="tap ${isMe(x)?'me':''}" data-act="player" data-u="${esc(x.pid||x.username)}"><td>${num?i+1:''}</td><td>${esc(dn(x))}${x.reliable?'':'<span class="badge">settling</span>'}${x.tougher?'<div class="note" style="margin:2px 0 0">needs tougher opponents</div>':''}</td><td><b>${(+x.rating).toFixed(2)}</b></td><td>${x.games}</td><td>${dt(x.last_played)}</td></tr>`).join('')+'</table>';
  let h=`<div class="top"><h1>Leaderboard</h1><button class="sec" data-act="home"><span aria-hidden="true">🏠</span> Home</button></div>
  <div class="sub">Everyone's rating, 2.0 to 8.0. New players start at 3.5.</div>`;
  if(!board.length)h+=`<div class="card"><div class="note" style="margin:0">No ratings yet. Ratings are built from finished rated events where all four players in a game have accounts. Just-for-fun events don't count.</div></div>`;
  else{
    h+=`<div class="card"><h2>Ranked (${rk.length})</h2>${rk.length?tbl(rk,true):'<div class="note" style="margin:0">Nobody is ranked yet. You need 12 rated games across at least 3 events.</div>'}</div>`;
    if(pv.length)h+=`<div class="card"><h2>Not ranked yet (${pv.length})</h2>${tbl(pv,false)}<div class="note">Listed once a player has 12 rated games across at least 3 events.</div></div>`;
    if(ia.length)h+=`<div class="card dim"><h2>Inactive (${ia.length})</h2>${tbl(ia,false)}<div class="note">No games in the last 6 months. They return to the ranking when they play again.</div></div>`;
  }
  h+=`<div class="card"><h2>How ratings work</h2><div class="note" style="margin-top:0">Every game compares how many points each side won with what their ratings predicted. Winning never lowers your rating and losing never raises it, so a favorite who wins by less than expected stays put. Beating stronger players moves you more, and beating weaker ones counts for less and less the further ahead of them you already are. Wins over brand-new or unproven players count for less too. Your rating can't climb far past the players you've beaten, so to keep rising you have to beat higher-rated players. New or returning players adjust faster. Games with a guest (no account) don't count.</div>
    <div class="note"><b>Settling:</b> the rating is still moving quickly, or it rests on only a few different opponents.<br><b>Needs tougher opponents:</b> your rating is a point or more above the best team you've beaten. It isn't proven yet. Beat higher-rated players to confirm it.</div></div>`;
  return h;
}

function openStand(){
  const s={};
  games.filter(g=>gDone(g)&&!g.voided).forEach(g=>{
    [[g.a,g.sa,g.sb],[g.b,g.sb,g.sa]].forEach(([t,f,a])=>t.forEach(x=>{
      const r=s[x.n]||(s[x.n]={n:x.n,p:x.p,g:0,w:0,l:0,pf:0,pa:0});
      r.g++;r.pf+=f;r.pa+=a;f>a?r.w++:r.l++;
    }));
  });
  return Object.values(s).sort((x,y)=>y.w-x.w||(y.pf-y.pa)-(x.pf-x.pa)||x.n.localeCompare(y.n));
}
function gameRow(g){
  return `<div class="mrow first" style="border-top:1px solid var(--bd)"><div><span class="t">${gTeam(g.a)}</span> <b>${g.sa}</b> – <b>${g.sb}</b> <span class="t">${gTeam(g.b)}</span>${g.rated?'':'<span class="badge">unrated</span>'}</div></div>`;

/* ---------- data ---------- */
async function loadMine(){
  const {data}=await sb.from('tournaments').select('id,code,name,starts_at,location,status,current_round,created_at,fee,result,admin_id,kind,money,rated,format').order('created_at',{ascending:false}).limit(100);
  mine=data||[];
  const b=await sb.rpc('leaderboard');board=Array.isArray(b.data)?b.data:[];
  const f=await sb.rpc('activity');feed=Array.isArray(f.data)?f.data:[];
  const w=await sb.rpc('whoami');if(w.data&&prof)Object.assign(prof,setProf(w.data));
  if(prof&&prof.pub){const n=await sb.rpc('nearby_players');nearby=Array.isArray(n.data)?n.data:[]}else nearby=[];
}
async function loadMembers(){
  const {data}=await sb.from('members').select('*').eq('tournament_id',T.id).order('created_at');
  M=data||[];
}
async function loadGames(){
  const {data}=await sb.from('games').select('*').eq('tournament_id',T.id).order('created_at');
  games=data||[];
}
function viewFor(s){return s==='done'?'done':T.kind==='open'?'open':s==='lobby'?'lobby':'play'}
function subscribe(){
  unsubscribe();
  let tm=null;const sched=()=>{clearTimeout(tm);tm=setTimeout(refresh,300)};
  chan=sb.channel('t-'+T.id)
    .on('postgres_changes',{event:'*',schema:'scrambler',table:'tournaments',filter:'id=eq.'+T.id},sched)
    .on('postgres_changes',{event:'*',schema:'scrambler',table:'members'},sched)
    .on('postgres_changes',{event:'*',schema:'scrambler',table:'games'},sched)
    .subscribe();
  poll=setInterval(()=>{if(!document.hidden)refresh()},8000);
}
function unsubscribe(){
  if(chan){sb.removeChannel(chan);chan=null}
  if(poll){clearInterval(poll);poll=null}
}
async function openT(id){
  const {data,error}=await sb.from('tournaments').select('*').eq('id',id).maybeSingle();
  if(error||!data)return false;
  dlg='';renaming=false;T=data;await loadMembers();games=[];if(T.kind==='open')await loadGames();drafts={};editG='';pick=defaultPick();
  ls.set('pb_last',id);
  view=viewFor(T.status);
  cur=view==='play'?T.current_round-1:0;
  render();subscribe();window.scrollTo(0,0);
  return true;
}
async function goHome(){
  unsubscribe();dlg='';T=null;M=[];games=[];view='home';ls.del('pb_last');
  await loadMine();render();window.scrollTo(0,0);
}
const typing=()=>{const a=document.activeElement;return !!(a&&(a.tagName==='INPUT'||a.tagName==='SELECT')&&a.closest&&a.closest('#ob'))};
const scoreFocused=()=>{const a=document.activeElement;return !!(a&&a.dataset&&a.dataset.m!==undefined&&a.closest&&a.closest('#round'))};
async function refresh(){
  if(!T||busy)return;busy=true;
  try{
    const {data,error}=await sb.from('tournaments').select('*').eq('id',T.id).maybeSingle();
    if(error)return;
    if(!data){toast("You're no longer in this event");await goHome();return}
    const wasAdmin=isAdmin(),oldCR=T.current_round;
    const oldFix=new Map();(T.rounds||[]).forEach((r,ri)=>r.forEach((m,j)=>{if(m.fix)oldFix.set(ri+'-'+j,m.fix.at)}));
    T=data;await loadMembers();
    (T.rounds||[]).forEach((r,ri)=>r.forEach((m,j)=>{if(m.fix&&oldFix.get(ri+'-'+j)!==m.fix.at&&m.fix.by!==prof?.username&&view==='play')toast(`✎ ${m.fix.by} corrected a score: ${[...m.a].map(i=>T.players[i]).join(' & ')} ${m.sa}–${m.sb} ${[...m.b].map(i=>T.players[i]).join(' & ')} (was ${m.fix.was})`)}));if(T.kind==='open')await loadGames();
    if(T.current_round>oldCR){if(cur===oldCR-1){cur=T.current_round-1;drafts={}}toast(`${unit()} ${T.current_round} has started`)}
    const v=viewFor(T.status);
    if(v!==view||wasAdmin!==isAdmin()){view=v;if(v==='play')cur=Math.min(cur,T.current_round-1);render();return}
    if(view==='lobby'){renderMembers();updateNote()}
    else if(view==='open'){if(typing())needOpen=true;else renderOpen()}
    else if(view==='play'){
      if(cur>=T.rounds.length)cur=T.rounds.length-1;
      renderTabs();renderCtl();renderStand();
      if(scoreFocused())needRound=true;else renderRound();
    }
  }finally{busy=false}
}

const actions={

  async psave(){

  },
  async pinsave(){
    const o=$('pold').value,n=$('pnew').value,n2=$('pnew2').value;

    if(n.length<4)return derr(`New PIN is too short. Use 4 to 6 digits (you entered ${n.length}).`,'pnew');
    if(n!==n2)return derr("The two new PINs don't match.",'pnew2');
    let r;try{r=await rpc('change_pin',{p_old:o,p_new:n},true)}catch(e){return derr(e.friendly)}
    if(!r?.ok)return derr(r?.error||'Could not change the PIN.',{old:'pold',new:'pnew'}[r?.field]);
    toast('PIN changed');dlg='profile';renderModal();
  },
  async emsend(){
    const em=($('em').value||'').trim().toLowerCase();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em))return derr('Enter a valid email address.','em');
    mailC=mailClient();
    const {error}=await mailC.auth.signInWithOtp({email:em,options:{shouldCreateUser:true,emailRedirectTo:location.origin+location.pathname}});
    if(error)return derr(mailErr(error));
    emailAddr=em;emailStep='code';renderModal();$('emc')?.focus();
  },
  emback(){emailStep='enter';renderModal()},
  async emverify(){
    const tok=($('emc').value||'').replace(/\D/g,'');
    if(tok.length<6)return derr('Enter the code from the email.','emc');
    const v=await mailC.auth.verifyOtp({email:emailAddr,token:tok,type:'email'});
    if(v.error)return derr("That code didn't work. Check it, or go back and request a new one.",'emc');
    let r;
    try{const nonce=await rpc('begin_link',{p_kind:'email'},true);const x=await mailC.rpc('finish_link',{p_nonce:nonce});r=x.data;if(x.error)return derr(friendly(x.error))}catch(e){return derr(e.friendly)}
    if(!r?.ok)return derr(r?.error||'Could not save the email.');
    try{await mailC.auth.signOut()}catch(e){}
    mailC=null;const w=await rpc('whoami');if(w)Object.assign(prof,setProf(w));
    emailStep='enter';emailAddr='';toast('Recovery email saved');dlg='profile';renderModal();
  },
  emclear(el){twoTap(el,'Tap again to remove',async()=>{await rpc('clear_recovery_email');prof.email='';emailStep='enter';toast('Recovery email removed');renderModal()})},
  async fgsend(){
    const em=($('fe').value||'').trim().toLowerCase();
    const fail=m=>{const e=$('autherr');if(e)e.textContent=m;return false};
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em))return fail('Enter a valid email address.');
    mailC=mailClient();
    const {error}=await mailC.auth.signInWithOtp({email:em,options:{shouldCreateUser:false,emailRedirectTo:location.origin+location.pathname}});
    // an unknown address looks the same as a known one, so nobody can use this to find out who has an account
    if(error&&(error.status===429||/rate limit|security purposes|too many|network|fetch/i.test(error.message||'')))return fail(mailErr(error));
    fgEmail=em;fgStep='code';render();$('fc')?.focus();
  },
  fgback(){fgStep='email';render()},
  async fgverify(){
    const fail=(m,id)=>{const e=$('autherr');if(e)e.textContent=m;if(id&&$(id)){$(id).classList.add('bad');$(id).focus()}return false};
    const tok=($('fc').value||'').replace(/\D/g,''),p=$('fp').value,p2=$('fp2').value;
    if(tok.length<6)return fail('Enter the code from the email.','fc');
    if(p.length<4)return fail(`PIN is too short. Use 4 to 6 digits (you entered ${p.length}).`,'fp');
    if(p!==p2)return fail("The two PINs don't match. Re-enter them.",'fp2');
    const v=await mailC.auth.verifyOtp({email:fgEmail,token:tok,type:'email'});
    if(v.error)return fail("That code didn't work, or this email isn't on an account. Check it, or go back and request a new one.",'fc');
    let r;
    try{const nonce=await rpc('begin_link',{p_kind:'reset'},true);const x=await mailC.rpc('finish_link',{p_nonce:nonce,p_new_pin:p});r=x.data;if(x.error)return fail(friendly(x.error))}catch(e){return fail(e.friendly||'Something went wrong. Try again.')}
    if(!r?.ok)return fail(/No account/.test(r?.error||'')?'No account has that recovery email.':(r?.error||'Could not reset the PIN.'),r?.field==='new'?'fp':'');
    try{await mailC.auth.signOut()}catch(e){}
    mailC=null;const me=await rpc('whoami');
    prof=setProf(me||{profile_id:r.profile_id,username:r.username});ls.set('pb_user',r.username);
    fgStep='email';authMode='in';await loadMine();view='home';render();window.scrollTo(0,0);toast('PIN changed. You are signed in.');
  },
  async auth(){
    const fail=(msg,id)=>{
      const el=$('autherr');if(el)el.textContent=msg;
      document.querySelectorAll('#app input.bad').forEach(x=>x.classList.remove('bad'));
      if(id&&$(id)){$(id).classList.add('bad');$(id).focus()}
    };
    fail('');
    const typed=cleanCode($('icode')?.value||'');
    if($('icode')&&($('icode').value||'').trim()&&typed.length<5)return fail('Invite codes have 5 characters. Check it, or clear the box.','icode');
    const u=($('un').value||'').trim().replace(/ {2,}/g,' '),p=$('pin').value||'';
    if(u.length<2)return fail('Username must be at least 2 characters.','un');
    if(u.length>20)return fail('Username can be at most 20 characters.','un');
    if(!/^[A-Za-z0-9 _.\-]+$/.test(u))return fail('Username can only use letters, numbers, spaces and . _ -','un');
    if(!/^\d*$/.test(p))return fail('PIN can only be numbers.','pin');
    if(p.length<4)return fail(`PIN is too short. Use 4 to 6 digits (you entered ${p.length}).`,'pin');
    if(p.length>6)return fail('PIN is too long. Use 4 to 6 digits.','pin');
    let r;
    try{
      if(authMode==='new'){
        if(p!==$('pin2').value)return fail("The two PINs don't match. Re-enter them.",'pin2');
        const raw=($('dupr')?.value||'').trim();let dv=null;
        if(raw!==''){dv=+raw;if(!(dv>=2&&dv<=6))return fail('DUPR must be between 2.0 and 6.0, or leave it blank.','dupr')}
        r=await rpc('create_account',{p_username:u,p_pin:p,p_dupr:dv},true);
      }else r=await rpc('sign_in',{p_username:u,p_pin:p},true);
    }catch(err){return fail(err.friendly||'Something went wrong. Try again.')}
    if(!r||!r.ok){
      const map={username:'un',pin:'pin',dupr:'dupr'};
      let msg=r?.error||'Could not sign in.';
      if(/taken/i.test(msg))msg='That username is already taken. Pick another, or use the Sign in tab if it is yours.';
      else if(/wrong username or pin/i.test(msg))msg='Wrong username or PIN. Check both and try again, or use the Create account tab if you are new. Five wrong tries locks the account for 15 minutes.';
      return fail(msg,map[r?.field]||(/PIN/.test(msg)?'pin':'un'));
    }
    const me=await rpc('whoami');
    prof=setProf(me||{profile_id:r.profile_id,username:r.username});ls.set('pb_user',r.username);
    if(typed.length===5)pendingCode=typed;
    await loadMine();view='home';render();window.scrollTo(0,0);
    if(pendingCode){try{await actions.join()}catch(e){}}   /* an invite: go straight into the game, no extra tap */
  },
  async signout(){
    try{await rpc('sign_out')}catch(e){return}
    unsubscribe();prof=null;T=null;M=[];mine=[];ls.del('pb_last');authMode='in';view='auth';render();
  },
  fmt(el){const k=el.dataset.k;newKind=k==='open'?'open':'scramble';newFormat=k==='series'?'series':'random';if(k==='open'&&newType==='money')newType='rated';renderModal()},
  typ(el){newType=el.dataset.v;renderModal()},
  async player(el){
    const u=el.dataset.u;if(!u)return;
    const r=await rpc('player_profile',{p_who:u,p_limit:100});
    if(!r)return toast('Could not find that player');
    if(dlg==='player'&&plyr&&plyr.info?.id!==r.id)plyrBack.push(plyr);else if(dlg!=='player')plyrBack=[];
    plyr={u,info:r,rows:Array.isArray(r.rows)?r.rows:[]};dlg='player';renderModal();
  },
  pback(){plyr=plyrBack.pop()||plyr;renderModal()},
  async feedopen(el){
    if(el.dataset.mine==='1'){if(!await openT(el.dataset.id))toast('Could not open that event');return}
    const r=await rpc('event_info',{p_id:el.dataset.id});
    if(!r)return toast('That event has ended or is no longer listed');
    evt=r;dlg='event';renderModal();
  },
  renstart(){renaming=true;render();$('rname')?.focus()},
  async rensave(){
    const v=id=>($(id)?.value||'').trim();
    const name=v('rname').slice(0,40),when=fromLocalInput(v('rwhen')),where=v('rwhere').slice(0,80),notes=v('rnotes').slice(0,500);
    await rpc('update_event',{p_tid:T.id,p_name:name,p_starts:when,p_location:where,p_notes:notes});
    T.name=name||null;T.starts_at=when;T.location=where||null;T.notes=notes||null;renaming=false;render();
  },
  rencancel(){renaming=false;render()},
  dopen(el){dlg=el.dataset.d;if(dlg==='pemail'){emailStep='enter';emailAddr=''}renderModal();if(el.dataset.focus)setTimeout(()=>$(el.dataset.focus)?.focus(),60)},
  dclose(){dlg='';plyrBack=[];renderModal()},
  pastall(){showAllPast=!showAllPast;render()},
  async create(){
    const r=await rpc('create_tournament',{p_kind:newKind,p_format:newKind==='open'?'random':newFormat,p_money:newKind==='open'?false:newType==='money',p_rated:newType!=='fun',p_name:newName.trim()||null,p_starts:fromLocalInput(newWhen),p_location:newWhere.trim()||null,p_notes:newNotes.trim()||null});
    newName=newWhen=newWhere=newNotes='';
    await openT(r.id);
  },
  async gstart(){
    const p=pick;
    if(!p.p1||!p.p2||!p.o1||!p.o2)return toast('Choose all four players');
    if(new Set([p.p1,p.p2,p.o1,p.o2]).size<4)return toast('Pick four different players');
    await rpc('open_game',{p_tid:T.id,p_a:[p.p1,p.p2],p_b:[p.o1,p.o2]});
    pick={...defaultPick(),p1:isAdmin()?p.p1:defaultPick().p1};
    await loadGames();renderOpen();toast('Game started');
  },
  async gscore(el){
    const id=el.dataset.g,a=document.querySelector(`#ob [data-g="${id}"][data-s="sa"]`),b=document.querySelector(`#ob [data-g="${id}"][data-s="sb"]`);
    const sa=(a?.value||'').trim(),sb2=(b?.value||'').trim();
    if(!/^\d{1,3}$/.test(sa)||!/^\d{1,3}$/.test(sb2))return toast('Enter both scores');
    if(+sa===+sb2)return toast("Someone has to win. Scores can't be tied");
    await rpc('score_game',{p_gid:id,p_sa:sa,p_sb:sb2});
    delete drafts[`g-${id}-sa`];delete drafts[`g-${id}-sb`];editG='';
    await loadGames();renderOpen();toast('Score saved');
  },
  gedit(el){editG=el.dataset.g||'';renderOpen()},
  async gcancel(el){await rpc('cancel_game',{p_gid:el.dataset.g});await loadGames();renderOpen()},
  gend(el){twoTap(el,'Tap again to end the event',async()=>{await rpc('close_session',{p_tid:T.id});await refresh()})},
  async join(){
    const c=cleanCode($('code')?.value||pendingCode);
    if(c.length<5){toast('Enter the 5-character code');return}
    const id=await rpc('join_tournament',{p_code:c});
    pendingCode='';history.replaceState(null,'',location.pathname);
    await openT(id);
  },
  noinvite(){pendingCode='';history.replaceState(null,'',location.pathname);render()},
  async open(el){if(!await openT(el.dataset.id))toast('Could not open that event')},
  home(){return goHome()},
  async setstart(){
    const raw=($('dupr2').value||'').trim();let v=null;
    if(raw!==''){v=+raw;if(!(v>=2&&v<=6))return toast('Enter a rating between 2.0 and 6.0, or leave it blank')}
    await rpc('set_start_rating',{p_rating:v});prof.start=v;toast(v===null?'Starting rating cleared':'Starting rating saved');renderModal();if(view==='home')render();
  },
  async board(){await loadMine();view='board';render();window.scrollTo(0,0)},
  async share(){
    const url=link();
    if(navigator.share){try{await navigator.share({title:'Pickleball Scrambler',text:'Join my pickleball event! Code '+T.code,url});return}catch(e){if(e.name==='AbortError')return}}
    try{await navigator.clipboard.writeText(url);toast('Link copied')}catch(e){$('lnk').select();toast('Copy the link shown above')}
  },
  async addguest(){
    const v=($('gname').value||'').trim();if(!v)return;
    await rpc('add_guest',{p_tid:T.id,p_name:v});
    $('gname').value='';await refresh();
  },
  async approve(el){await rpc('set_approved',{p_member_id:el.dataset.id,p_approved:true});await refresh()},
  async unapprove(el){await rpc('set_approved',{p_member_id:el.dataset.id,p_approved:false});await refresh()},
  async rm(el){await rpc('remove_member',{p_member_id:el.dataset.id});await refresh()},
  async start(){
    await loadMembers();
    const ap=approved();
    if(!validN(ap.length)){toast(isSeries()?'A series needs exactly 4 approved players':'Need 4 to 16 approved players');updateNote();return}
    toast('Building the schedule…');await new Promise(r=>setTimeout(r,60));
    const players=ap.map(m=>m.name),pids=ap.map(m=>m.profile_id),rounds=isSeries()?genSeries():genSchedule(players.length,roundsFor(players.length));
    if(!rounds){toast('Could not build a valid schedule. Try again.');return}
    await rpc('start_tournament',{p_tid:T.id,p_players:players,p_pids:pids,p_rounds:rounds});
    await refresh();
  },
  tab(el){cur=+el.dataset.r;confirmKey='';renderTabs();renderRound()},
  submitedit(){confirmKey='';renderRound()},
  submitok(el){return actions.submit(el)},
  goscore(){cur=T.current_round-1;confirmKey='';renderTabs();renderRound();$('round').scrollIntoView({behavior:'smooth',block:'start'})},
  sinc(el){bump(el,1)},
  sdec(el){bump(el,-1)},
  s11(el){
    const j=el.dataset.m,s=el.dataset.s,o=s==='sa'?'sb':'sa',k=x=>`${cur}-${j}-${x}`;
    drafts[k(s)]='11';if(+(drafts[k(o)]??T.rounds[cur][j][o])>=11||drafts[k(o)]===undefined&&T.rounds[cur][j][o]==='')drafts[k(o)]='';
    renderRound();
    const other=document.querySelector(`#round input[data-m="${j}"][data-s="${o}"]`);if(other&&other.value==='')other.focus();
  },
  async submit(el){
    const j=+el.dataset.m,ri=cur;
    const a=document.querySelector(`#round input[data-m="${j}"][data-s="sa"]`),b=document.querySelector(`#round input[data-m="${j}"][data-s="sb"]`);
    const sa=(a?.value||'').trim(),sb2=(b?.value||'').trim();
    if(!/^\d{1,3}$/.test(sa)||!/^\d{1,3}$/.test(sb2))return toast('Enter both scores');
    if(cash()&&!(Math.max(+sa,+sb2)===11&&Math.min(+sa,+sb2)<=10))return toast('Moneyball games go to 11, win by 1. The winner has 11, the other team 0 to 10.');
    if(isSeries()&&+sa===+sb2)return toast('A game in a series needs a winner (no ties)');
    if(confirmKey!==`${ri}-${j}`){drafts[`${ri}-${j}-sa`]=sa;drafts[`${ri}-${j}-sb`]=sb2;confirmKey=`${ri}-${j}`;renderRound();return}
    confirmKey='';
    await rpc('submit_score',{p_tid:T.id,p_round:ri+1,p_match:j,p_sa:sa,p_sb:sb2});
    delete drafts[`${ri}-${j}-sa`];delete drafts[`${ri}-${j}-sb`];
    const prev=T.rounds[ri][j],was=filled(prev),chg=was&&(+prev.sa!==+sa||+prev.sb!==+sb2);
    T.rounds[ri][j]={...prev,sa:String(+sa),sb:String(+sb2),...(was?{}:{by:prof.username}),...(chg?{fix:{by:prof.username,at:new Date().toISOString(),was:prev.sa+'–'+prev.sb,first:prev.fix?.first||prev.sa+'–'+prev.sb,n:(prev.fix?.n||0)+1}}:{})};
    renderTabs();renderRound();renderCtl();renderStand();toast(chg?'Score corrected. The others in this game can see it.':'Score submitted');
    if(isSeries()||(ri+1===T.current_round&&allIn(T.rounds[ri])))await refresh();
  },
  async nextround(){await rpc('next_round',{p_tid:T.id});await refresh();cur=T.current_round-1;renderPlayBody();window.scrollTo(0,0)},
  finish(){finAsk=true;renderCtl()},
  finishno(){finAsk=false;renderCtl()},
  async finishok(){
    finAsk=false;
    const p=cash()?payoutsFor(T.players.length,+T.fee||0):[],st=placed(standings(),p);
    const result=st.map(x=>({p:T.pids?.[x.i]??null,n:x.n,pf:x.pf,d:x.pf-x.pa,pay:x.pay,pl:x.pl,...(x.tie?{tie:true,odd:x.odd}:{}),gw:x.gw,g:x.g,...(isSeries()?{sw:x.sw}:{})}));
    await rpc('finish_tournament',{p_tid:T.id,p_rounds:T.rounds,p_result:result});
    await refresh();
  },
  del(el){twoTap(el,'Tap again to delete',async()=>{
    try{await rpc('delete_tournament',{p_tid:T.id});await goHome()}catch(e){}
  })}
};
document.addEventListener('click',async e=>{
  if(e.target.id==='modalbd'){dlg='';renderModal();return}
  const el=e.target.closest('[data-act]');if(!el||!actions[el.dataset.act])return;
  const act=el.dataset.act,lock=el.tagName==='BUTTON'&&!['del','tab','share','mode','fmt','mon','gend','gedit','board','dopen','dclose','pastall'].includes(act);
  if(lock)el.disabled=true;
  try{await actions[act](el)}catch(err){console.error(err)}
  if(lock&&el.isConnected)el.disabled=false;
  if(act==='start')updateNote();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.closest&&t.closest('#app')&&$('autherr')&&t.tagName==='INPUT'){$('autherr').textContent='';t.classList.remove('bad')}
  if(t.closest&&t.closest('#modal')&&$('derr')){$('derr').textContent='';t.classList.remove('bad')}
  if(t.id==='tname')newName=t.value;
  else if(t.id==='twhen')newWhen=t.value;
  else if(t.id==='twhere')newWhere=t.value;
  else if(t.id==='tnotes')newNotes=t.value;
  else if(t.id==='code')t.value=cleanCode(t.value);
  else if(['pin','pin2','pold','pnew','pnew2','fp','fp2'].includes(t.id))t.value=t.value.replace(/\D/g,'').slice(0,6);
  else if(['fc','emc'].includes(t.id))t.value=t.value.replace(/\D/g,'').slice(0,10);
  else if(t.dataset&&t.dataset.g&&view==='open')drafts[`g-${t.dataset.g}-${t.dataset.s}`]=t.value;
  else if(t.dataset&&t.dataset.m!==undefined&&view==='play')drafts[`${cur}-${t.dataset.m}-${t.dataset.s}`]=t.value;
});
document.addEventListener('focusout',()=>{
  setTimeout(()=>{if(needRound&&view==='play'&&!scoreFocused())renderRound();if(needOpen&&view==='open'&&!typing())renderOpen()},80);
});
document.addEventListener('change',async e=>{
  if(e.target.id==='twhen'){newWhen=e.target.value;return}
  if(e.target.dataset&&e.target.dataset.slot){pick[e.target.dataset.slot]=e.target.value;return}
  if(e.target.id==='rsel'){chosenR=+e.target.value;updateNote();return}
  if(e.target.id==='fee'&&isAdmin()){
    const v=Math.max(0,Math.min(1000,+e.target.value||0));
    T.fee=v;updateNote();
    try{await rpc('set_fee',{p_tid:T.id,p_fee:v})}catch(err){}
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&dlg){dlg='';renderModal();return}
  if(e.key!=='Enter')return;
  const id=e.target.id;
  if(id==='gname')actions.addguest();
  else if(id==='code')actions.join();
  else if(id==='un'||id==='pin'||id==='pin2'||id==='dupr')actions.auth();
  else if(id==='dupr2')actions.setstart();
  else if(['pdn','pcity'].includes(id))actions.psave();
  else if(['pold','pnew','pnew2'].includes(id))actions.pinsave();
  else if(id==='em')actions.emsend();
  else if(id==='emc')actions.emverify();
  else if(id==='fe')actions.fgsend();
  else if(['fc','fp','fp2'].includes(id))actions.fgverify();
  else if(id==='rname')actions.rensave();
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});

/* ---------- boot ---------- */
function fatal(msg){$('app').innerHTML=TITLE+`<div class="card"><h2>Setup needed</h2><div>${msg}</div></div>`}
(async function init(){
  if(SUPABASE_URL.startsWith('YOUR_')||SUPABASE_KEY.startsWith('YOUR_')){
    fatal('Paste your Supabase project URL and anon key at the top of the script in <code>index.html</code>, and run <code>scrambler-schema.sql</code> in the Supabase SQL editor.');return;
  }
  if(!window.supabase){fatal('Could not load the Supabase library. Check your connection and reload.');return}
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{db:{schema:'scrambler'},auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  let {data:{session}}=await sb.auth.getSession();
  if(!session){
    const r=await sb.auth.signInAnonymously();
    if(r.error){fatal('Anonymous sign-in failed: '+esc(r.error.message)+'. Enable "Allow anonymous sign-ins" in Supabase Authentication settings.');return}
    session=r.data.session;
  }
  pendingCode=cleanCode(new URLSearchParams(location.search).get('t'));
  if(pendingCode&&!ls.get('pb_user'))authMode='new';   /* someone following an invite on a fresh phone is almost always new */
  let w=null;
  try{w=await rpc('whoami')}catch(e){fatal('Could not reach the scrambler schema. Did you run <code>scrambler-schema.sql</code> and expose the <code>scrambler</code> schema?');return}
  if(!w){view='auth';render();return}
  prof=setProf(w);
  const last=ls.get('pb_last');
  if(last&&!pendingCode){
    if(await openT(last)&&T.status!=='done')return;
    if(T){unsubscribe();T=null}
  }
  await loadMine();view='home';render();
})();
</script></body></html>
