const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- payouts + schedule ---------- */
/* Payouts: 1st gets half the pot and the last paid place gets exactly its entry fee back. The other places
   share what's left, stepping down evenly. Places paid: 3 for 4-7 players, 4 for 8-13, 5 for 14-16.
   Amounts are whole units of the fee's smallest step ($1 for whole-dollar fees) and always add up to the pot. */
function payoutPlaces(n){return n<=7?3:n<=13?4:5}
function payouts(n,fee){
  const u=[1,.5,.25,.1,.05,.01].find(x=>Math.abs(fee/x-Math.round(fee/x))<1e-6)||.01;
  const f=Math.round(fee/u),P=n*f,first=Math.round(P/2);
  let k=payoutPlaces(n);
  while(k>2&&P-first-(k-1)*f<0)k--;
  const m=k-1,E=P-first-m*f,ex=Array(m).fill(0);
  if(m===1)ex[0]=E;
  else{
    const w=Array.from({length:m},(_,j)=>m-1-j),sum=w.reduce((x,y)=>x+y,0);
    const ideal=w.map(x=>E*x/sum);
    ideal.forEach((v,i)=>ex[i]=Math.floor(v+1e-9));
    let left=E-ex.reduce((x,y)=>x+y,0);
    const order=ideal.map((_,i)=>i).sort((x,y)=>(ideal[y]-ex[y])-(ideal[x]-ex[x])||x-y);
    for(let j=0;left>0;j++,left--)ex[order[j%order.length]]++;
  }
  return [first,...ex.map(e=>f+e)].map(x=>Math.round(x*u*100)/100).sort((x,y)=>y-x);
}
/* Courts: the games in a round are played at the same time, one per court (court = position in the round).
   Reorder each round's games so nobody gets stuck on one court: pick the order that repeats courts least. */
function assignCourts(rounds,n){
  const seen=Array.from({length:n},()=>({}));
  const perms=a=>a.length<2?[a]:a.flatMap((x,i)=>perms([...a.slice(0,i),...a.slice(i+1)]).map(p=>[x,...p]));
  return rounds.map(R=>{
    let best=null,bs=1e9;
    for(const p of perms(R.map((_,i)=>i))){
      let c=0;
      p.forEach((mi,court)=>[...R[mi].a,...R[mi].b].forEach(x=>{c+=(seen[x][court]||0)**2}));
      c+=Math.random()*0.01;
      if(c<bs){bs=c;best=p}
    }
    const out=best.map(i=>R[i]);
    out.forEach((m,court)=>[...m.a,...m.b].forEach(x=>{seen[x][court]=(seen[x][court]||0)+1}));
    return out;
  });
}
function genSchedule(n,R){
  const b=n%4;               // players sitting out each round
  for(let limit=2;limit<=4;limit++){
    const tries=limit==2?400:300;
    for(let attempt=0;attempt<tries;attempt++){
      const partner=new Set(),opp={},byeCnt=Array(n).fill(0),rounds=[];let ok=true;
      for(let r=0;r<R&&ok;r++){
        let found=null;
        for(let t=0;t<150&&!found;t++){
          let byes=[];
          if(b>0)byes=shuf([...Array(n).keys()]).sort((x,y)=>byeCnt[x]-byeCnt[y]).slice(0,b);
          const pool=shuf([...Array(n).keys()].filter(i=>!byes.includes(i))),teams=[];let bad=false;
          while(pool.length){
            const a=pool.shift();
            const idx=pool.findIndex(c=>!partner.has(a+'-'+c)&&!partner.has(c+'-'+a));
            if(idx<0){bad=true;break}
            teams.push([a,pool.splice(idx,1)[0]]);
          }
          if(bad)continue;
          const ts=shuf(teams),matches=[],cnt={};let good=true;
          for(let i=0;i<ts.length;i+=2){
            for(const x of ts[i])for(const y of ts[i+1]){
              const k1=x+'-'+y;
              if(((opp[k1]||0)+(cnt[k1]||0))>=limit)good=false;
              cnt[k1]=(cnt[k1]||0)+1;cnt[y+'-'+x]=(cnt[y+'-'+x]||0)+1;
            }
            matches.push({a:ts[i],b:ts[i+1],sa:'',sb:''});
          }
          if(good)found={matches,teams,cnt,byes};
        }
        if(!found){ok=false;break}
        found.teams.forEach(([x,y])=>{partner.add(x+'-'+y);partner.add(y+'-'+x)});
        for(const k in found.cnt)opp[k]=(opp[k]||0)+found.cnt[k];
        found.byes.forEach(i=>byeCnt[i]++);
        rounds.push(found.matches);
      }
      if(ok)return assignCourts(rounds,n);
    }
  }
  return null;
}

/* Rounds that give every player the same number of games (sit-outs rotate evenly). */
const gamesEach=(n,r)=>r*(n-n%4)/n;
function roundChoices(n){
  const b=n%4,out=[];
  for(let r=2;r<=n;r++){
    if(b&&(b*r)%n)continue;
    if(gamesEach(n,r)>n-1)continue;   // can't have more distinct partners than other players
    out.push(r);
  }
  const d=defaultRounds(n);
  return out.filter(r=>r<=Math.max(7,d));
}
function defaultRounds(n){
  if(n%4===0)return n===4?3:n/2;
  for(let r=3;r<=n;r++)if((n%4*r)%n===0)return r;
  return n;
}
function standings(){
  const s=T.players.map((n,i)=>({i,n,pf:0,pa:0,g:0}));
  T.rounds.forEach(r=>r.forEach(m=>{
    if(!filled(m))return;
    m.a.forEach(i=>{s[i].pf+=+m.sa;s[i].pa+=+m.sb;s[i].g++});
    m.b.forEach(i=>{s[i].pf+=+m.sb;s[i].pa+=+m.sa;s[i].g++});
  }));
  return s.sort((x,y)=>y.pf-x.pf||(y.pf-y.pa)-(x.pf-x.pa));
}

function statsHTML(){

  </div><div class="note">Cashed in ${cashed} of ${rs.length}. Finished tournaments only.</div></div>`;
}

  }else{

        :`Teams are drawn for you each round, no repeat partners. You'll be the director: you ${newMoney?'approve players once they pay, ':''}start each round, and everyone enters their own scores.`}</div></div>
      <div class="card"><h2>Join with a code</h2>

      <button data-act="join" style="flex:0 0 90px">Join</button></div></div>`;
  }

  if(mine.length){
    h+='<div class="card"><h2>Your tournaments</h2>'+mine.map(t=>{
      let st;
      if(t.kind==='open'){
        const r=(t.result||[]).find(x=>x.p===prof.id);

        else{const net=(+t.result[i].pay||0)-(+t.fee);st=`#${i+1} of ${t.result.length} · <b class="${cls(net)}">${money(net)}</b>`}
      }else st=t.status==='playing'?`Round ${t.current_round}`:'Lobby';
      return `<div class="tl" data-act="open" data-id="${t.id}"><div><b>${new Date(t.created_at).toLocaleDateString()}</b> <span>· ${esc(t.code)}${t.admin_id===prof.id?' · director':''}</span></div><span>${st} ›</span></div>`;
    }).join('')+'</div>';
  }
  return h;
}

/* ----- leaderboard ----- */
const isMe=x=>!!prof&&String(x.username).toLowerCase()===prof.username.toLowerCase();
const rankedNow=()=>board.filter(x=>x.ranked&&x.active);
function boardCardHTML(){
  if(!board.length)return `<div class="card"><div class="tl" data-act="board" style="border:0;padding:0"><div><h2 style="margin:0 0 2px">Leaderboard</h2><span>No ratings yet. They start after your first finished event.</span></div><span>›</span></div></div>`;

function boardHTML(){
  const rk=rankedNow(),ia=board.filter(x=>x.ranked&&!x.active),pv=board.filter(x=>!x.ranked);
  const dt=d=>{const x=new Date(d),o={month:'short',day:'numeric'};if(x.getFullYear()!==new Date().getFullYear())o.year='numeric';return x.toLocaleDateString(undefined,o)};
  const tbl=(rows,num,cl='')=>`<table class="${cl}"><tr><th>${num?'#':''}</th><th>Player</th><th>Rating</th><th>Games</th><th>Last</th></tr>`+rows.map((x,i)=>`<tr class="${isMe(x)?'me':''}"><td>${num?i+1:''}</td><td>${esc(x.username)}${x.reliable?'':'<span class="badge">settling</span>'}${x.tougher?'<div class="note" style="margin:2px 0 0">needs tougher opponents</div>':''}</td><td><b>${(+x.rating).toFixed(2)}</b></td><td>${x.games}</td><td>${dt(x.last_played)}</td></tr>`).join('')+'</table>';
  let h=`<div class="top"><h1>Leaderboard</h1><button class="sec" data-act="home">Home</button></div>
  <div class="sub">Everyone's rating, 2.0 to 8.0. New players start at 3.5.</div>`;
  if(!board.length)h+=`<div class="card"><div class="note" style="margin:0">No ratings yet. Ratings are built from finished events where all four players in a game have accounts.</div></div>`;
  else{
    h+=`<div class="card"><h2>Ranked (${rk.length})</h2>${rk.length?tbl(rk,true):'<div class="note" style="margin:0">Nobody is ranked yet. You need 12 rated games across at least 3 events.</div>'}</div>`;
    if(pv.length)h+=`<div class="card"><h2>Not ranked yet (${pv.length})</h2>${tbl(pv,false)}<div class="note">Listed once a player has 12 rated games across at least 3 events.</div></div>`;
    if(ia.length)h+=`<div class="card dim"><h2>Inactive (${ia.length})</h2>${tbl(ia,false)}<div class="note">No games in the last 6 months. They return to the ranking when they play again.</div></div>`;
  }

    <div class="note"><b>Settling:</b> the rating is still moving quickly, or it rests on only a few different opponents.<br><b>Needs tougher opponents:</b> your rating is a point or more above the best team you've beaten. It isn't proven yet. Beat higher-rated players to confirm it.</div></div>`;

/* ----- open play ----- */
const gDone=g=>g.sa!=null&&g.sb!=null;
const gTeam=t=>t.map(x=>esc(x.n)).join(' &amp; ');
const gMine=g=>!!prof&&[...g.a,...g.b].some(x=>x.p===prof.id);
const gCan=g=>T.status==='playing'&&(isAdmin()||gMine(g));
const myMemberId=()=>myMember()?.id||'';
function defaultPick(){return {p1:myMemberId(),p2:'',o1:'',o2:''}}
function openHTML(){
  return `<div class="top"><h1>Open play</h1><button class="sec" data-act="home">Home</button></div>
  <div class="sub">${isAdmin()?'You are the host. ':''}Anyone with the code can join any time. Pick your partner and opponents, play, then enter the score.</div>
  <div class="card"><label style="text-align:center">Invite code</label><div class="code">${esc(T.code)}</div>
    <div class="lnk"><input id="lnk" readonly value="${esc(link())}"><button data-act="share">Share</button></div></div>
  <div id="ob"></div>`;
}
function openStand(){
  const s={};
  games.filter(g=>gDone(g)&&!g.voided).forEach(g=>{
    [[g.a,g.sa,g.sb],[g.b,g.sb,g.sa]].forEach(([t,f,a])=>t.forEach(x=>{
      const r=s[x.n]||(s[x.n]={n:x.n,p:x.p,g:0,w:0,l:0,pf:0,pa:0});
      r.g++;r.pf+=f;r.pa+=a;f>a?r.w++:r.l++;
    }));
  });
  return Object.values(s).sort((x,y)=>y.w-x.w||(y.pf-y.pa)-(x.pf-x.pa)||x.n.localeCompare(y.n));
}
function gameRow(g){
  return `<div class="mrow first" style="border-top:1px solid var(--bd)"><div><span class="t">${gTeam(g.a)}</span> <b>${g.sa}</b> – <b>${g.sb}</b> <span class="t">${gTeam(g.b)}</span>${g.rated?'':'<span class="badge">unrated</span>'}</div></div>`;
}
function scoreBox(g){

  return `<div class="match${gMine(g)?' mine':''}"><div class="t">${gTeam(g.a)}</div>${ib('sa')}
    <div class="vs">vs</div><div class="t">${gTeam(g.b)}</div>${ib('sb')}
    <div class="foot"><button data-act="gscore" data-g="${g.id}">${gDone(g)?'Save score':'Submit score'}</button>
    ${gDone(g)?`<button class="del" data-act="gedit" data-g="">cancel</button>`:`<button class="del" data-act="gcancel" data-g="${g.id}">cancel game</button>`}
    ${!g.rated?'<span>unrated (guest)</span>':''}</div></div>`;
}

  const el=$('ob');if(!el)return;needOpen=false;

    h+=`<div class="card"><h2>Start a game</h2>
      <div class="row">${adm?sel('p1','Player 1'):`<div><label>Player 1</label><div class="t" style="padding:10px 0">You</div></div>`}${sel('p2',adm?'Player 2':'Your partner')}</div>

  }).join(''):'<div class="note">Nothing yet.</div>')+'</div>';
  const st=openStand();
  if(st.length)h+=`<div class="card"><h2>Standings</h2><table><tr><th>#</th><th>Player</th><th>G</th><th>W</th><th>L</th><th>+/−</th></tr>`+
    st.map((x,i)=>`<tr class="${x.p&&prof&&x.p===prof.id?'me':''}"><td>${i+1}</td><td>${esc(x.n)}</td><td>${x.g}</td><td>${x.w}</td><td>${x.l}</td><td>${x.pf-x.pa>0?'+':''}${x.pf-x.pa}</td></tr>`).join('')+
    `</table><div class="note">Ranked by wins, then point differential.</div></div>`;
  h+=`<div class="card"><h2>Players (${ok.length})</h2>`+ok.map((m,i)=>{
    const isDir=m.profile_id&&m.profile_id===T.admin_id,has=games.some(g=>[...g.a,...g.b].some(x=>x.n===m.name));

  }).join('')+(adm?`<div class="row sp"><input id="gname" placeholder="Add a player without a phone" maxlength="30"><button data-act="addguest" style="flex:0 0 80px">Add</button></div>`:'')+'</div>';

    <div class="note" style="text-align:center">${live.length?'Finish or cancel games in progress first.':'Saves the standings. Games stay on record.'}</div>
    <div style="text-align:center;margin-top:14px"><button class="del" data-act="del">Delete session</button></div>`;
  el.innerHTML=h;
}
function doneOpenHTML(){
  const r=T.result||[],fin=games.filter(g=>gDone(g)&&!g.voided).slice().reverse();
  return `<div class="top"><h1>Open play results</h1><button class="sec" data-act="home">Home</button></div>
  <div class="sub">${new Date(T.created_at).toLocaleDateString()} · ${r.length} players · ${fin.length} games</div>
  <div class="card"><h2>🏆 ${esc(r[0]?.n||'')}</h2><table><tr><th>#</th><th>Player</th><th>G</th><th>W</th><th>L</th><th>+/−</th></tr>`+
  r.map((x,i)=>`<tr class="${x.p&&prof&&x.p===prof.id?'me':''}"><td>${i+1}</td><td>${esc(x.n)}</td><td>${x.g}</td><td>${x.w}</td><td>${x.l}</td><td>${x.d>0?'+':''}${x.d}</td></tr>`).join('')+
  `</table></div><div class="card"><h2>Games</h2>${fin.map(gameRow).join('')}</div>${isAdmin()?'<div style="text-align:center"><button class="del" data-act="del">Delete session</button></div>':''}`;
}

/* ---------- data ---------- */
async function loadMine(){
  const {data}=await sb.from('tournaments').select('id,code,status,current_round,created_at,fee,result,admin_id,kind,money').order('created_at',{ascending:false}).limit(100);
  mine=data||[];
  const b=await sb.rpc('leaderboard');board=Array.isArray(b.data)?b.data:[];
  const w=await sb.rpc('whoami');if(w.data&&prof){prof.start=w.data.start_rating;prof.locked=!!w.data.locked}
}
async function loadMembers(){
  const {data}=await sb.from('members').select('*').eq('tournament_id',T.id).order('created_at');
  M=data||[];
}
async function loadGames(){
  const {data}=await sb.from('games').select('*').eq('tournament_id',T.id).order('created_at');
  games=data||[];
}
function viewFor(s){return s==='done'?'done':T.kind==='open'?'open':s==='lobby'?'lobby':'play'}
function subscribe(){
  unsubscribe();
  let tm=null;const sched=()=>{clearTimeout(tm);tm=setTimeout(refresh,300)};
  chan=sb.channel('t-'+T.id)
    .on('postgres_changes',{event:'*',schema:'scrambler',table:'tournaments',filter:'id=eq.'+T.id},sched)
    .on('postgres_changes',{event:'*',schema:'scrambler',table:'members'},sched)
    .on('postgres_changes',{event:'*',schema:'scrambler',table:'games'},sched)
    .subscribe();
  poll=setInterval(()=>{if(!document.hidden)refresh()},8000);
}
function unsubscribe(){
  if(chan){sb.removeChannel(chan);chan=null}
  if(poll){clearInterval(poll);poll=null}
}
async function openT(id){
  const {data,error}=await sb.from('tournaments').select('*').eq('id',id).maybeSingle();
  if(error||!data)return false;
  T=data;await loadMembers();games=[];if(T.kind==='open')await loadGames();drafts={};editG='';pick=defaultPick();
  ls.set('pb_last',id);
  view=viewFor(T.status);
  cur=view==='play'?T.current_round-1:0;
  render();subscribe();window.scrollTo(0,0);
  return true;
}
async function goHome(){
  unsubscribe();T=null;M=[];games=[];view='home';ls.del('pb_last');
  await loadMine();render();window.scrollTo(0,0);
}
const typing=()=>{const a=document.activeElement;return !!(a&&(a.tagName==='INPUT'||a.tagName==='SELECT')&&a.closest&&a.closest('#ob'))};
const scoreFocused=()=>{const a=document.activeElement;return !!(a&&a.dataset&&a.dataset.m!==undefined&&a.closest&&a.closest('#round'))};
async function refresh(){
  if(!T||busy)return;busy=true;
  try{
    const {data,error}=await sb.from('tournaments').select('*').eq('id',T.id).maybeSingle();
    if(error)return;
    if(!data){toast("You're no longer in this tournament");await goHome();return}
    const wasAdmin=isAdmin(),oldCR=T.current_round;
    T=data;await loadMembers();if(T.kind==='open')await loadGames();
    if(T.current_round>oldCR&&cur>=oldCR-1){cur=T.current_round-1;drafts={}}
    const v=viewFor(T.status);
    if(v!==view||wasAdmin!==isAdmin()){view=v;if(v==='play')cur=Math.min(cur,T.current_round-1);render();return}
    if(view==='lobby'){renderMembers();updateNote()}
    else if(view==='open'){if(typing())needOpen=true;else renderOpen()}
    else if(view==='play'){
      if(cur>=T.current_round)cur=T.current_round-1;
      renderTabs();renderCtl();renderStand();
      if(scoreFocused())needRound=true;else renderRound();
    }
  }finally{busy=false}
}

/* ---------- actions ---------- */
const actions={
  mode(el){authMode=el.dataset.m;render();$('un')?.focus()},
  async auth(){
    const u=($('un').value||'').trim(),p=$('pin').value||'';
    if(u.length<2)return toast('Enter a username (2–20 characters)');
    if(!/^\d{4,6}$/.test(p))return toast('PIN must be 4 to 6 digits');
    let r;
    if(authMode==='new'){
      if(p!==$('pin2').value)return toast("PINs don't match");
      const raw=($('dupr')?.value||'').trim();let dv=null;
      if(raw!==''){dv=+raw;if(!(dv>=2&&dv<=6))return toast('DUPR must be between 2.0 and 6.0, or left blank')}
      r=await rpc('create_account',{p_username:u,p_pin:p,p_dupr:dv});
    }else r=await rpc('sign_in',{p_username:u,p_pin:p});
    if(!r||!r.ok)return toast(r?.error||'Could not sign in');
    const me=await rpc('whoami');
    prof={id:r.profile_id,username:r.username,start:me?.start_rating??null,locked:!!me?.locked};ls.set('pb_user',r.username);
    await loadMine();view='home';render();window.scrollTo(0,0);
  },
  async signout(){
    try{await rpc('sign_out')}catch(e){return}
    unsubscribe();prof=null;T=null;M=[];mine=[];ls.del('pb_last');authMode='in';view='auth';render();
  },
  fmt(el){newKind=el.dataset.k;render()},
  mon(el){newMoney=el.dataset.v==='1';render()},
  async create(){
    const r=await rpc('create_tournament',{p_kind:newKind,p_money:newKind==='open'?false:newMoney});
    await openT(r.id);
  },
  async gstart(){
    const p=pick;
    if(!p.p1||!p.p2||!p.o1||!p.o2)return toast('Choose all four players');
    if(new Set([p.p1,p.p2,p.o1,p.o2]).size<4)return toast('Pick four different players');
    await rpc('open_game',{p_tid:T.id,p_a:[p.p1,p.p2],p_b:[p.o1,p.o2]});
    pick={...defaultPick(),p1:isAdmin()?p.p1:defaultPick().p1};
    await loadGames();renderOpen();toast('Game started');
  },
  async gscore(el){
    const id=el.dataset.g,a=document.querySelector(`#ob [data-g="${id}"][data-s="sa"]`),b=document.querySelector(`#ob [data-g="${id}"][data-s="sb"]`);
    const sa=(a?.value||'').trim(),sb2=(b?.value||'').trim();
    if(!/^\d{1,3}$/.test(sa)||!/^\d{1,3}$/.test(sb2))return toast('Enter both scores');
    if(+sa===+sb2)return toast("Someone has to win. Scores can't be tied");
    await rpc('score_game',{p_gid:id,p_sa:sa,p_sb:sb2});
    delete drafts[`g-${id}-sa`];delete drafts[`g-${id}-sb`];editG='';
    await loadGames();renderOpen();toast('Score saved');
  },
  gedit(el){editG=el.dataset.g||'';renderOpen()},
  async gcancel(el){await rpc('cancel_game',{p_gid:el.dataset.g});await loadGames();renderOpen()},
  gend(el){twoTap(el,'Tap again to end the session',async()=>{await rpc('close_session',{p_tid:T.id});await refresh()})},
  async join(){
    const c=cleanCode($('code')?.value);
    if(c.length<5){toast('Enter the 5-character code');return}
    const id=await rpc('join_tournament',{p_code:c});
    pendingCode='';history.replaceState(null,'',location.pathname);
    await openT(id);
  },
  noinvite(){pendingCode='';history.replaceState(null,'',location.pathname);render()},
  async open(el){if(!await openT(el.dataset.id))toast('Could not open that tournament')},
  home(){return goHome()},
  async setstart(){
    const raw=($('dupr2').value||'').trim();let v=null;
    if(raw!==''){v=+raw;if(!(v>=2&&v<=6))return toast('Enter a rating between 2.0 and 6.0, or leave it blank')}
    await rpc('set_start_rating',{p_rating:v});prof.start=v;toast(v===null?'Starting rating cleared':'Starting rating saved');
  },
  async board(){await loadMine();view='board';render();window.scrollTo(0,0)},
  async share(){
    const url=link();
    if(navigator.share){try{await navigator.share({title:'Pickleball Scrambler',text:'Join my pickleball tournament! Code '+T.code,url});return}catch(e){if(e.name==='AbortError')return}}
    try{await navigator.clipboard.writeText(url);toast('Link copied')}catch(e){$('lnk').select();toast('Copy the link shown above')}
  },
  async addguest(){
    const v=($('gname').value||'').trim();if(!v)return;
    await rpc('add_guest',{p_tid:T.id,p_name:v});
    $('gname').value='';await refresh();
  },
  async approve(el){await rpc('set_approved',{p_member_id:el.dataset.id,p_approved:true});await refresh()},
  async unapprove(el){await rpc('set_approved',{p_member_id:el.dataset.id,p_approved:false});await refresh()},
  async rm(el){await rpc('remove_member',{p_member_id:el.dataset.id});await refresh()},
  async start(){
    await loadMembers();
    const ap=approved();
    if(!validN(ap.length)){toast('Need 4 to 16 approved players');updateNote();return}
    toast('Building the schedule…');await new Promise(r=>setTimeout(r,60));
    const players=ap.map(m=>m.name),pids=ap.map(m=>m.profile_id),rounds=genSchedule(players.length,roundsFor(players.length));
    if(!rounds){toast('Could not build a valid schedule. Try again.');return}
    await rpc('start_tournament',{p_tid:T.id,p_players:players,p_pids:pids,p_rounds:rounds});
    await refresh();
  },
  tab(el){cur=+el.dataset.r;renderTabs();renderRound()},
  async submit(el){
    const j=+el.dataset.m,ri=cur;
    const a=document.querySelector(`#round [data-m="${j}"][data-s="sa"]`),b=document.querySelector(`#round [data-m="${j}"][data-s="sb"]`);
    const sa=(a?.value||'').trim(),sb2=(b?.value||'').trim();
    if(!/^\d{1,3}$/.test(sa)||!/^\d{1,3}$/.test(sb2))return toast('Enter both scores');
    await rpc('submit_score',{p_tid:T.id,p_round:ri+1,p_match:j,p_sa:sa,p_sb:sb2});
    delete drafts[`${ri}-${j}-sa`];delete drafts[`${ri}-${j}-sb`];
    T.rounds[ri][j]={...T.rounds[ri][j],sa:String(+sa),sb:String(+sb2),by:prof.username};
    renderTabs();renderRound();renderCtl();renderStand();toast('Score submitted');
  },
  async nextround(){await rpc('next_round',{p_tid:T.id});await refresh();cur=T.current_round-1;renderPlayBody();window.scrollTo(0,0)},
  async finish(){
    const st=standings(),p=cash()?payouts(T.players.length,+T.fee||0):[];
    const result=st.map((x,i)=>({p:T.pids?.[x.i]??null,n:x.n,pf:x.pf,d:x.pf-x.pa,pay:i<p.length?p[i]:0}));
    await rpc('finish_tournament',{p_tid:T.id,p_rounds:T.rounds,p_result:result});
    await refresh();
  },
  del(el){twoTap(el,'Tap again to delete',async()=>{
    try{await rpc('delete_tournament',{p_tid:T.id});await goHome()}catch(e){}
  })}
};
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el||!actions[el.dataset.act])return;
  const act=el.dataset.act,lock=el.tagName==='BUTTON'&&!['del','tab','share','mode','fmt','mon','gend','gedit','board'].includes(act);
  if(lock)el.disabled=true;
  try{await actions[act](el)}catch(err){console.error(err)}
  if(lock&&el.isConnected)el.disabled=false;
  if(act==='start')updateNote();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='code')t.value=cleanCode(t.value);
  else if(t.id==='pin'||t.id==='pin2')t.value=t.value.replace(/\D/g,'').slice(0,6);
  else if(t.dataset&&t.dataset.g&&view==='open')drafts[`g-${t.dataset.g}-${t.dataset.s}`]=t.value;
  else if(t.dataset&&t.dataset.m!==undefined&&view==='play')drafts[`${cur}-${t.dataset.m}-${t.dataset.s}`]=t.value;
});
document.addEventListener('focusout',()=>{
  setTimeout(()=>{if(needRound&&view==='play'&&!scoreFocused())renderRound();if(needOpen&&view==='open'&&!typing())renderOpen()},80);
});
document.addEventListener('change',async e=>{
  if(e.target.dataset&&e.target.dataset.slot){pick[e.target.dataset.slot]=e.target.value;return}
  if(e.target.id==='rsel'){chosenR=+e.target.value;updateNote();return}
  if(e.target.id==='fee'&&isAdmin()){
    const v=Math.max(0,Math.min(1000,+e.target.value||0));
    T.fee=v;updateNote();
    try{await rpc('set_fee',{p_tid:T.id,p_fee:v})}catch(err){}
  }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const id=e.target.id;
  if(id==='gname')actions.addguest();
  else if(id==='code')actions.join();
  else if(id==='un'||id==='pin'||id==='pin2'||id==='dupr')actions.auth();
  else if(id==='dupr2')actions.setstart();
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});

/* ---------- boot ---------- */
function fatal(msg){$('app').innerHTML=TITLE+`<div class="card"><h2>Setup needed</h2><div>${msg}</div></div>`}
(async function init(){
  if(SUPABASE_URL.startsWith('YOUR_')||SUPABASE_KEY.startsWith('YOUR_')){
    fatal('Paste your Supabase project URL and anon key at the top of the script in <code>index.html</code>, and run <code>scrambler-schema.sql</code> in the Supabase SQL editor.');return;
  }
  if(!window.supabase){fatal('Could not load the Supabase library. Check your connection and reload.');return}
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{db:{schema:'scrambler'},auth:{persistSession:true,autoRefreshToken:true}});
  let {data:{session}}=await sb.auth.getSession();
  if(!session){
    const r=await sb.auth.signInAnonymously();
    if(r.error){fatal('Anonymous sign-in failed: '+esc(r.error.message)+'. Enable "Allow anonymous sign-ins" in Supabase Authentication settings.');return}
    session=r.data.session;
  }
  pendingCode=cleanCode(new URLSearchParams(location.search).get('t'));
  let w=null;
  try{w=await rpc('whoami')}catch(e){fatal('Could not reach the scrambler schema. Did you run <code>scrambler-schema.sql</code> and expose the <code>scrambler</code> schema?');return}
  if(!w){view='auth';render();return}
  prof={id:w.profile_id,username:w.username,start:w.start_rating,locked:!!w.locked};
  const last=ls.get('pb_last');
  if(last&&!pendingCode){
    if(await openT(last)&&T.status!=='done')return;
    if(T){unsubscribe();T=null}
  }
  await loadMine();view='home';render();
})();
</script></body></html>
