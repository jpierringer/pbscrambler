const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const LOGO='<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><g transform="rotate(-30 14 20)"><rect x="4" y="3" width="19" height="23" rx="8" fill="#2f7d32"/><rect x="11.5" y="25" width="4" height="12" rx="2" fill="#8a5a2b"/></g><circle cx="29" cy="27" r="9" fill="#e5e83a" stroke="#9aa000" stroke-width="1"/><g fill="#9aa000"><circle cx="29" cy="22" r="1.3"/><circle cx="24.5" cy="25" r="1.3"/><circle cx="33.5" cy="25" r="1.3"/><circle cx="29" cy="27" r="1.3"/><circle cx="24.5" cy="30" r="1.3"/><circle cx="33.5" cy="30" r="1.3"/><circle cx="29" cy="32" r="1.3"/></g></svg>';

let sb,prof=null,T=null,M=[],mine=[],view='home',cur=0,chan=null,poll=null,busy=false,pendingCode='',authMode='in',drafts={},needRound=false;

/* ---------- helpers ---------- */
function toast(t){const e=$('toast');e.textContent=t;e.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hide'),3500)}
function twoTap(btn,label,fn){
  if(btn.dataset.arm){clearTimeout(btn._t);delete btn.dataset.arm;btn.textContent=btn._orig;fn();return}
  btn._orig=btn.textContent;btn.dataset.arm=1;btn.textContent=label;
  btn._t=setTimeout(()=>{delete btn.dataset.arm;btn.textContent=btn._orig},3000);
}
async function rpc(fn,args){
  const {data,error}=await sb.rpc(fn,args);
  if(error){toast(error.message);throw error}
  return data;
}
const $$=v=>'$'+(Math.round(v*100)/100);
const money=v=>(v>0?'+':v<0?'−':'')+$$(Math.abs(v));
const cls=v=>v>0?'pos':v<0?'neg':'';
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const cleanCode=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5);
const isAdmin=()=>!!(T&&prof&&T.admin_id===prof.id);
const filled=m=>m.sa!==''&&m.sb!=='';
const myIdx=()=>(T&&T.pids&&prof)?T.pids.indexOf(prof.id):-1;
const myMember=()=>M.find(m=>m.profile_id&&prof&&m.profile_id===prof.id);
const approved=()=>M.filter(m=>m.approved);
const inMatch=m=>{const i=myIdx();return i>=0&&(m.a.includes(i)||m.b.includes(i))};
const canEdit=(ri,m)=>T.status==='playing'&&(isAdmin()||(ri+1===T.current_round&&inMatch(m)));
const allIn=r=>r.every(filled);
const tournamentOver=()=>T.current_round===T.rounds.length&&T.rounds.every(allIn);

/* ---------- payouts + schedule ---------- */
function weights(k){
  if(k==4)return[3.5,2,1.5,1];
  return Array.from({length:k},(_,i)=>Math.pow(k-i,1.4));
}
function payouts(n,fee){
  const k=Math.floor(n/2),w=weights(k),sum=w.reduce((a,b)=>a+b,0),pool=n*fee;
  const p=w.map(x=>Math.round(pool*x/sum));
  p[0]+=pool-p.reduce((a,b)=>a+b,0);
  return p;
}
function genSchedule(n,R){
  const b=n%4;               // players sitting out each round
  for(let limit=2;limit<=4;limit++){
    const tries=limit==2?400:300;
    for(let attempt=0;attempt<tries;attempt++){
      const partner=new Set(),opp={},byeCnt=Array(n).fill(0),rounds=[];let ok=true;
      for(let r=0;r<R&&ok;r++){
        let found=null;
        for(let t=0;t<150&&!found;t++){
          let byes=[];
          if(b>0)byes=shuf([...Array(n).keys()]).sort((x,y)=>byeCnt[x]-byeCnt[y]).slice(0,b);
          const pool=shuf([...Array(n).keys()].filter(i=>!byes.includes(i))),teams=[];let bad=false;
          while(pool.length){
            const a=pool.shift();
            const idx=pool.findIndex(c=>!partner.has(a+'-'+c)&&!partner.has(c+'-'+a));
            if(idx<0){bad=true;break}
            teams.push([a,pool.splice(idx,1)[0]]);
          }
          if(bad)continue;
          const ts=shuf(teams),matches=[],cnt={};let good=true;
          for(let i=0;i<ts.length;i+=2){
            for(const x of ts[i])for(const y of ts[i+1]){
              const k1=x+'-'+y;
              if(((opp[k1]||0)+(cnt[k1]||0))>=limit)good=false;
              cnt[k1]=(cnt[k1]||0)+1;cnt[y+'-'+x]=(cnt[y+'-'+x]||0)+1;
            }
            matches.push({a:ts[i],b:ts[i+1],sa:'',sb:''});
          }
          if(good)found={matches,teams,cnt,byes};
        }
        if(!found){ok=false;break}
        found.teams.forEach(([x,y])=>{partner.add(x+'-'+y);partner.add(y+'-'+x)});
        for(const k in found.cnt)opp[k]=(opp[k]||0)+found.cnt[k];
        found.byes.forEach(i=>byeCnt[i]++);
        rounds.push(found.matches);
      }
      if(ok)return rounds;
    }
  }
  return null;
}

/* Rounds that give every player the same number of games (sit-outs rotate evenly). */
const gamesEach=(n,r)=>r*(n-n%4)/n;
function roundChoices(n){
  const b=n%4,out=[];
  for(let r=2;r<=n;r++){
    if(b&&(b*r)%n)continue;
    if(gamesEach(n,r)>n-1)continue;   // can't have more distinct partners than other players
    out.push(r);
  }
  const d=defaultRounds(n);
  return out.filter(r=>r<=Math.max(7,d));
}
function defaultRounds(n){
  if(n%4===0)return n===4?3:n/2;
  for(let r=3;r<=n;r++)if((n%4*r)%n===0)return r;
  return n;
}
function standings(){
  const s=T.players.map((n,i)=>({i,n,pf:0,pa:0,g:0}));
  T.rounds.forEach(r=>r.forEach(m=>{
    if(!filled(m))return;
    m.a.forEach(i=>{s[i].pf+=+m.sa;s[i].pa+=+m.sb;s[i].g++});
    m.b.forEach(i=>{s[i].pf+=+m.sb;s[i].pa+=+m.sa;s[i].g++});
  }));
  return s.sort((x,y)=>y.pf-x.pf||(y.pf-y.pa)-(x.pf-x.pa));
}
const team=t=>t.map(i=>esc(T.players[i])).join(' &amp; ');
const link=()=>location.href.split('#')[0].split('?')[0]+'?t='+T.code;

/* ---------- my stats (from finished tournaments) ---------- */
function myResults(){
  return mine.filter(t=>t.status==='done'&&Array.isArray(t.result)).map(t=>{
    const i=t.result.findIndex(x=>x.p===prof.id);
    return i<0?null:{t,rank:i+1,n:t.result.length,fee:+t.fee,pay:+t.result[i].pay||0};
  }).filter(Boolean);
}
function statsHTML(){
  const rs=myResults();if(!rs.length)return '';
  const spent=rs.reduce((a,r)=>a+r.fee,0),won=rs.reduce((a,r)=>a+r.pay,0),net=won-spent;
  const roi=spent?Math.round(net/spent*100):0;
  const avg=(rs.reduce((a,r)=>a+r.rank,0)/rs.length).toFixed(1);
  const firsts=rs.filter(r=>r.rank===1).length,cashed=rs.filter(r=>r.pay>0).length;
  const tile=(b,s,c='')=>`<div class="stat"><b class="${c}">${b}</b><span>${s}</span></div>`;
  return `<div class="card"><h2>Your record</h2><div class="stats">
    ${tile(rs.length,'Played')}${tile(firsts,'1st places')}${tile(avg,'Avg finish')}
    ${tile($$(spent),'Spent')}${tile($$(won),'Won')}${tile(money(net),'Net · '+(roi>0?'+':'')+roi+'% ROI',cls(net))}
  </div><div class="note">Cashed in ${cashed} of ${rs.length}. Finished tournaments only.</div></div>`;
}

/* ---------- views ---------- */
function render(){
  const a=$('app');
  if(view==='auth')a.innerHTML=authHTML();
  else if(view==='home')a.innerHTML=homeHTML();
  else if(view==='lobby'){a.innerHTML=lobbyHTML();renderMembers();updateNote()}
  else if(view==='play'){a.innerHTML=playHTML();renderPlayBody()}
  else if(view==='done'){a.innerHTML=doneHTML()}
}

function authHTML(){
  const nw=authMode==='new',u=esc(ls.get('pb_user')||'');
  return TITLE+`<div class="sub">Random partners each round. No repeat partners, max 2 meetings with any opponent.</div>
  ${pendingCode?`<div class="card" style="text-align:center"><h2>You're invited 🎉</h2><div class="code" style="padding-bottom:0">${esc(pendingCode)}</div><div class="note">Sign in or create an account to join.</div></div>`:''}
  <div class="card"><div class="tabs">

    <button class="sp" data-act="auth">${nw?'Create account':'Sign in'}</button>
    <div class="note">No email needed. Your username and PIN keep your tournament history on any phone. There's no PIN reset, so pick one you'll remember.</div></div>`;
}

  }else{
    h+=`<div class="card"><button data-act="create">Start a new tournament</button>

    }).join('')+'</div>';
  }
  return h;
}

/* ----- lobby ----- */
function lobbyHTML(){
  const adm=isAdmin();
  return `<div class="top"><h1>Lobby</h1><button class="sec" data-act="home">Home</button></div>
  <div class="sub">${adm?'You are the director. Approve players once they have paid and arrived.':'Waiting for everyone to arrive.'}</div>
  ${adm?'':'<div class="banner" id="banner"></div>'}
  <div class="card"><label style="text-align:center">Invite code</label><div class="code">${esc(T.code)}</div>
    <div class="lnk"><input id="lnk" readonly value="${esc(link())}"><button data-act="share">Share</button></div>
    <div class="note">Anyone with the link can join the lobby until round 1 starts.</div></div>
  <div class="card"><div class="row">
    <div><label style="margin-top:0">Entry fee ($)</label>${adm?`<input id="fee" type="number" min="0" step="0.5" inputmode="decimal" value="${T.fee}">`:`<div class="t" style="padding:10px 0">${$$(+T.fee)}</div>`}</div>
    <div><label style="margin-top:0">Approved players</label><div class="t" style="padding:10px 0" id="pcount"></div></div></div>
    <div id="rbox"></div><div class="note" id="startnote"></div></div>
  <div class="card"><div id="mlist"></div>
    ${adm?`<div class="row sp"><input id="gname" placeholder="Add a player without a phone" maxlength="30"><button data-act="addguest" style="flex:0 0 80px">Add</button></div>`:''}</div>
  ${adm?`<button data-act="start" id="startbtn">Start round 1</button><div style="text-align:center;margin-top:14px"><button class="del" data-act="del">Delete tournament</button></div>`:''}`;
}
function renderMembers(){
  const el=$('mlist');if(!el)return;
  const adm=isAdmin();
  const row=(m,first)=>{
    const isDir=m.profile_id&&m.profile_id===T.admin_id;
    let acts='';
    if(adm){
      if(!m.approved)acts=`<button class="sec sm" data-act="approve" data-id="${m.id}">Approve</button><button class="del" data-act="rm" data-id="${m.id}">remove</button>`;
      else if(!isDir)acts=`<button class="del" data-act="unapprove" data-id="${m.id}">revoke</button>`;
    }
    return `<div class="mrow${first?' first':''}"><div>${esc(m.name)}${isDir?'<span class="badge">director</span>':''}${m.profile_id&&m.profile_id===prof.id?'<span class="badge">you</span>':''}${!m.profile_id?'<span class="badge">guest</span>':''}</div><div class="acts">${acts}</div></div>`;
  };
  const wait=M.filter(m=>!m.approved),ok=approved();
  el.innerHTML=(wait.length?`<div class="grp">Waiting for approval (${wait.length})</div>`+wait.map((m,i)=>row(m,i===0)).join(''):'')
    +`<div class="grp">Approved (${ok.length})</div>`+(ok.length?ok.map((m,i)=>row(m,i===0)).join(''):'<div class="note">Nobody yet.</div>');
}
const validN=n=>n>=4&&n<=16;
let chosenR=0;
const roundsFor=n=>roundChoices(n).includes(chosenR)?chosenR:defaultRounds(n);
function updateNote(){
  const n=approved().length,w=M.length-n,ok=validN(n),adm=isAdmin();
  if($('pcount'))$('pcount').textContent=n;
  const rb=$('rbox');
  if(rb){
    if(adm&&ok){
      if(document.activeElement?.id!=='rsel'){
        const o=roundChoices(n),r=roundsFor(n);
        rb.innerHTML=`<label>Rounds</label><select id="rsel">${o.map(x=>`<option value="${x}"${x===r?' selected':''}>${x} rounds · ${gamesEach(n,x)} games each</option>`).join('')}</select>`;
      }
    }else rb.innerHTML='';
  }
  const el=$('startnote');
  if(el){
    if(!adm)el.textContent='';
    else if(ok){
      const r=roundsFor(n),b=n%4,p=payouts(n,+T.fee||0);
      let t=`${r} rounds · everyone plays ${gamesEach(n,r)} games${b?` · ${b} sit out each round`:''} · pool ${$$(n*(+T.fee||0))} · payouts ${p.map((x,i)=>'#'+(i+1)+' '+$$(x)).join(', ')}.`;
      if(r>7){const alt=[n-1,n+1].filter(m=>validN(m)&&defaultRounds(m)<=7);t+=` That's a long event, because everyone has to play the same number of games.`+(alt.length?` ${alt.join(' or ')} players would be shorter.`:'')}
      if(w)t+=` ${w} still waiting will watch as spectators.`;
      el.textContent=t;
    }else el.textContent=n<4?`Need at least 4 approved players (${4-n} more).`:'Max 16 players. Revoke '+(n-16)+'.';
  }
  const b=$('startbtn');if(b)b.disabled=!ok;
  const bn=$('banner');
  if(bn){const me=myMember();bn.textContent=me&&me.approved?"You're approved ✓ Waiting for the director to start round 1.":`Waiting for the director to approve you. Pay the ${$$(+T.fee)} entry fee to the director.`}
}

/* ----- play ----- */
function playHTML(){
  const inGame=myIdx()>=0;
  return `<div class="top"><h1>Tournament</h1><button class="sec" data-act="home">Home</button></div>
  <div class="sub" id="pool"></div>
  ${inGame?'':'<div class="banner">You are watching this tournament.</div>'}
  <div class="tabs" id="tabs"></div>
  <div class="card" id="round"></div>
  <div class="card" id="ctl"></div>
  <div class="card"><h2 id="sh">Standings</h2><table id="st"></table>
    <div class="note">Ranked by total points scored, then point differential. Ties aren't split automatically, so settle them by hand.</div></div>
  ${isAdmin()?`<div style="text-align:center;margin-top:6px"><button class="del" data-act="del">Delete tournament</button></div>`:''}`;
}
function renderTabs(){
  $('tabs').innerHTML=T.rounds.slice(0,T.current_round).map((r,i)=>`<button class="${i==cur?'on ':''}${allIn(r)?'done':''}" data-act="tab" data-r="${i}">Round ${i+1}</button>`).join('');
}
function byesOf(ri){const on=new Set();T.rounds[ri].forEach(m=>[...m.a,...m.b].forEach(i=>on.add(i)));return T.players.map((_,i)=>i).filter(i=>!on.has(i))}
function byeHTML(ri){
  const b=byesOf(ri);if(!b.length)return '';
  const mineBye=b.includes(myIdx());
  return (mineBye?`<div class="banner" style="margin-top:12px">☕ You're sitting out this round</div>`:'')+`<div class="note" style="margin-top:12px">Sitting out: ${b.map(i=>esc(T.players[i])).join(', ')}</div>`;
}
function renderRound(){
  needRound=false;
  const ri=cur,R=T.rounds[ri];
  const n=R.filter(filled).length;
  $('round').innerHTML=`<h2>Round ${ri+1} of ${T.rounds.length} <span class="note" style="font-weight:400">· ${n} of ${R.length} scores in</span></h2>`+R.map((m,j)=>{
    const edit=canEdit(ri,m),mineM=inMatch(m);
    const val=s=>esc(drafts[`${ri}-${j}-${s}`]??m[s]);
    const box=s=>edit?`<input type="number" inputmode="numeric" min="0" max="999" data-m="${j}" data-s="${s}" value="${val(s)}" placeholder="0">`:`<div class="sc">${m[s]===''?'–':esc(m[s])}</div>`;
    let foot='';
    if(edit)foot=`<div class="foot"><button data-act="submit" data-m="${j}">${filled(m)?'Update score':'Submit score'}</button>${filled(m)&&m.by?`<span>Entered by ${esc(m.by)}</span>`:''}</div>`;
    else if(filled(m)&&m.by)foot=`<div class="foot"><span>Final · entered by ${esc(m.by)}</span></div>`;
    else if(!filled(m)&&ri+1===T.current_round&&T.status==='playing')foot=`<div class="foot"><span>Waiting for score</span></div>`;
    return `<div class="match${mineM?' mine':''}"><div class="t">${team(m.a)}</div>${box('sa')}
    <div class="vs">${mineM?'your game · ':''}vs</div>
    <div class="t">${team(m.b)}</div>${box('sb')}${foot}</div>`;
  }).join('')+byeHTML(ri);
}
function renderCtl(){
  const el=$('ctl');if(!el)return;
  const cr=T.current_round,R=T.rounds[cr-1],total=T.rounds.length,done=allIn(R),last=cr===total;
  const waiting=R.map(m=>filled(m)?null:`${team(m.a)} vs ${team(m.b)}`).filter(Boolean);
  let h=`<h2>Round ${cr} status</h2><div>${R.filter(filled).length} of ${R.length} games reported</div>`;
  if(waiting.length)h+=`<div class="note">Still playing: ${waiting.join(' · ')}</div>`;
  if(isAdmin()){
    h+=`<button class="sp" data-act="${last?'finish':'nextround'}" ${done?'':'disabled'}>${last?'Finish tournament':'Start round '+(cr+1)}</button>`;
    if(!done)h+=`<div class="note">${last?'Finish':'Next round'} unlocks when every game has a score. You can enter or fix any score yourself.</div>`;
  }else{
    h+=`<div class="note">${done?(last?'All games are in. Waiting for the director to finish.':'Round complete. Waiting for the director to start round '+(cr+1)+'.'):'Enter your score as soon as your game ends.'}</div>`;
  }
  el.innerHTML=h;
}
function renderStand(){
  const st=standings(),p=payouts(T.players.length,+T.fee||0);
  const over=tournamentOver();
  $('sh').textContent=over?'Final standings':'Standings (projected payouts)';
  $('st').innerHTML='<tr><th>#</th><th>Player</th><th>G</th><th>Pts</th><th>+/−</th><th>Payout</th></tr>'+st.map((x,i)=>`<tr class="${T.pids?.[x.i]&&T.pids[x.i]===prof.id?'me':''}"><td>${i+1}</td><td>${esc(x.n)}</td><td>${x.g}</td><td>${x.pf}</td><td>${x.pf-x.pa>0?'+':''}${x.pf-x.pa}</td><td class="pay">${i<p.length?$$(p[i]):''}</td></tr>`).join('');
  $('pool').textContent=`Code ${T.code} · Entry ${$$(+T.fee)} × ${T.players.length} players = ${$$(+T.fee*T.players.length)} pool`;
}
function renderPlayBody(){
  if(cur>=T.current_round)cur=T.current_round-1;
  if(cur<0)cur=0;
  renderTabs();renderRound();renderCtl();renderStand();
}
function doneHTML(){
  const r=T.result||[],pool=+T.fee*r.length;
  return `<div class="top"><h1>Final results</h1><button class="sec" data-act="home">Home</button></div>
  <div class="sub">${new Date(T.created_at).toLocaleDateString()} · ${r.length} players · ${$$(pool)} pool · entry ${$$(+T.fee)}</div>
  <div class="card"><h2>🏆 ${esc(r[0]?.n||'')}</h2><table><tr><th>#</th><th>Player</th><th>Pts</th><th>+/−</th><th>Paid</th></tr>`+
  r.map((x,i)=>`<tr class="${x.p&&x.p===prof.id?'me':''}"><td>${i+1}</td><td>${esc(x.n)}</td><td>${x.pf}</td><td>${x.d>0?'+':''}${x.d}</td><td class="pay">${x.pay?$$(x.pay):''}</td></tr>`).join('')+
  `</table></div>${isAdmin()?'<div style="text-align:center"><button class="del" data-act="del">Delete tournament</button></div>':''}`;
}

/* ---------- data ---------- */
async function loadMine(){
  const {data}=await sb.from('tournaments').select('id,code,status,current_round,created_at,fee,result,admin_id').order('created_at',{ascending:false}).limit(100);
  mine=data||[];
}
async function loadMembers(){
  const {data}=await sb.from('members').select('*').eq('tournament_id',T.id).order('created_at');
  M=data||[];
}
function viewFor(s){return s==='lobby'?'lobby':s==='playing'?'play':'done'}
function subscribe(){
  unsubscribe();
  let tm=null;const sched=()=>{clearTimeout(tm);tm=setTimeout(refresh,300)};
  chan=sb.channel('t-'+T.id)
    .on('postgres_changes',{event:'*',schema:'scrambler',table:'tournaments',filter:'id=eq.'+T.id},sched)
    .on('postgres_changes',{event:'*',schema:'scrambler',table:'members'},sched)
    .subscribe();
  poll=setInterval(()=>{if(!document.hidden)refresh()},8000);
}
function unsubscribe(){
  if(chan){sb.removeChannel(chan);chan=null}
  if(poll){clearInterval(poll);poll=null}
}
async function openT(id){
  const {data,error}=await sb.from('tournaments').select('*').eq('id',id).maybeSingle();
  if(error||!data)return false;
  T=data;await loadMembers();drafts={};
  ls.set('pb_last',id);
  view=viewFor(T.status);
  cur=view==='play'?T.current_round-1:0;
  render();subscribe();window.scrollTo(0,0);
  return true;
}
async function goHome(){
  unsubscribe();T=null;M=[];view='home';ls.del('pb_last');
  await loadMine();render();window.scrollTo(0,0);
}
const scoreFocused=()=>{const a=document.activeElement;return !!(a&&a.dataset&&a.dataset.m!==undefined&&a.closest&&a.closest('#round'))};
async function refresh(){
  if(!T||busy)return;busy=true;
  try{
    const {data,error}=await sb.from('tournaments').select('*').eq('id',T.id).maybeSingle();
    if(error)return;
    if(!data){toast("You're no longer in this tournament");await goHome();return}
    const wasAdmin=isAdmin(),oldCR=T.current_round;
    T=data;await loadMembers();
    if(T.current_round>oldCR&&cur>=oldCR-1){cur=T.current_round-1;drafts={}}
    const v=viewFor(T.status);
    if(v!==view||wasAdmin!==isAdmin()){view=v;if(v==='play')cur=Math.min(cur,T.current_round-1);render();return}
    if(view==='lobby'){renderMembers();updateNote()}
    else if(view==='play'){
      if(cur>=T.current_round)cur=T.current_round-1;
      renderTabs();renderCtl();renderStand();
      if(scoreFocused())needRound=true;else renderRound();
    }
  }finally{busy=false}
}

/* ---------- actions ---------- */
const actions={
  mode(el){authMode=el.dataset.m;render();$('un')?.focus()},
  async auth(){
    const u=($('un').value||'').trim(),p=$('pin').value||'';
    if(u.length<2)return toast('Enter a username (2–20 characters)');
    if(!/^\d{4,6}$/.test(p))return toast('PIN must be 4 to 6 digits');
    let r;
    if(authMode==='new'){
      if(p!==$('pin2').value)return toast("PINs don't match");
      r=await rpc('create_account',{p_username:u,p_pin:p});
    }else r=await rpc('sign_in',{p_username:u,p_pin:p});
    if(!r||!r.ok)return toast(r?.error||'Could not sign in');
    prof={id:r.profile_id,username:r.username};ls.set('pb_user',r.username);
    await loadMine();view='home';render();window.scrollTo(0,0);
  },
  async signout(){
    try{await rpc('sign_out')}catch(e){return}
    unsubscribe();prof=null;T=null;M=[];mine=[];ls.del('pb_last');authMode='in';view='auth';render();
  },
  async create(){
    const r=await rpc('create_tournament');
    await openT(r.id);
  },
  async join(){
    const c=cleanCode($('code')?.value);
    if(c.length<5){toast('Enter the 5-character code');return}
    const id=await rpc('join_tournament',{p_code:c});
    pendingCode='';history.replaceState(null,'',location.pathname);
    await openT(id);
  },
  noinvite(){pendingCode='';history.replaceState(null,'',location.pathname);render()},
  async open(el){if(!await openT(el.dataset.id))toast('Could not open that tournament')},
  home(){return goHome()},
  async share(){
    const url=link();
    if(navigator.share){try{await navigator.share({title:'Pickleball Scrambler',text:'Join my pickleball tournament! Code '+T.code,url});return}catch(e){if(e.name==='AbortError')return}}
    try{await navigator.clipboard.writeText(url);toast('Link copied')}catch(e){$('lnk').select();toast('Copy the link shown above')}
  },
  async addguest(){
    const v=($('gname').value||'').trim();if(!v)return;
    await rpc('add_guest',{p_tid:T.id,p_name:v});
    $('gname').value='';await refresh();
  },
  async approve(el){await rpc('set_approved',{p_member_id:el.dataset.id,p_approved:true});await refresh()},
  async unapprove(el){await rpc('set_approved',{p_member_id:el.dataset.id,p_approved:false});await refresh()},
  async rm(el){await rpc('remove_member',{p_member_id:el.dataset.id});await refresh()},
  async start(){
    await loadMembers();
    const ap=approved();
    if(!validN(ap.length)){toast('Need 4 to 16 approved players');updateNote();return}
    toast('Building the schedule…');await new Promise(r=>setTimeout(r,60));
    const players=ap.map(m=>m.name),pids=ap.map(m=>m.profile_id),rounds=genSchedule(players.length,roundsFor(players.length));
    if(!rounds){toast('Could not build a valid schedule. Try again.');return}
    await rpc('start_tournament',{p_tid:T.id,p_players:players,p_pids:pids,p_rounds:rounds});
    await refresh();
  },
  tab(el){cur=+el.dataset.r;renderTabs();renderRound()},
  async submit(el){
    const j=+el.dataset.m,ri=cur;
    const a=document.querySelector(`#round [data-m="${j}"][data-s="sa"]`),b=document.querySelector(`#round [data-m="${j}"][data-s="sb"]`);
    const sa=(a?.value||'').trim(),sb2=(b?.value||'').trim();
    if(!/^\d{1,3}$/.test(sa)||!/^\d{1,3}$/.test(sb2))return toast('Enter both scores');
    await rpc('submit_score',{p_tid:T.id,p_round:ri+1,p_match:j,p_sa:sa,p_sb:sb2});
    delete drafts[`${ri}-${j}-sa`];delete drafts[`${ri}-${j}-sb`];
    T.rounds[ri][j]={...T.rounds[ri][j],sa:String(+sa),sb:String(+sb2),by:prof.username};
    renderTabs();renderRound();renderCtl();renderStand();toast('Score submitted');
  },
  async nextround(){await rpc('next_round',{p_tid:T.id});await refresh();cur=T.current_round-1;renderPlayBody();window.scrollTo(0,0)},
  async finish(){
    const st=standings(),p=payouts(T.players.length,+T.fee||0);
    const result=st.map((x,i)=>({p:T.pids?.[x.i]??null,n:x.n,pf:x.pf,d:x.pf-x.pa,pay:i<p.length?p[i]:0}));
    await rpc('finish_tournament',{p_tid:T.id,p_rounds:T.rounds,p_result:result});
    await refresh();
  },
  del(el){twoTap(el,'Tap again to delete',async()=>{
    try{await rpc('delete_tournament',{p_tid:T.id});await goHome()}catch(e){}
  })}
};
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el||!actions[el.dataset.act])return;
  const act=el.dataset.act,lock=el.tagName==='BUTTON'&&!['del','tab','share','mode'].includes(act);
  if(lock)el.disabled=true;
  try{await actions[act](el)}catch(err){console.error(err)}
  if(lock&&el.isConnected)el.disabled=false;
  if(act==='start')updateNote();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='code')t.value=cleanCode(t.value);
  else if(t.id==='pin'||t.id==='pin2')t.value=t.value.replace(/\D/g,'').slice(0,6);
  else if(t.dataset&&t.dataset.m!==undefined&&view==='play')drafts[`${cur}-${t.dataset.m}-${t.dataset.s}`]=t.value;
});
document.addEventListener('focusout',()=>{
  setTimeout(()=>{if(needRound&&view==='play'&&!scoreFocused())renderRound()},80);
});
document.addEventListener('change',async e=>{
  if(e.target.id==='rsel'){chosenR=+e.target.value;updateNote();return}
  if(e.target.id==='fee'&&isAdmin()){
    const v=Math.max(0,Math.min(1000,+e.target.value||0));
    T.fee=v;updateNote();
    try{await rpc('set_fee',{p_tid:T.id,p_fee:v})}catch(err){}
  }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const id=e.target.id;
  if(id==='gname')actions.addguest();
  else if(id==='code')actions.join();
  else if(id==='un'||id==='pin'||id==='pin2')actions.auth();
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});

/* ---------- boot ---------- */
function fatal(msg){$('app').innerHTML=TITLE+`<div class="card"><h2>Setup needed</h2><div>${msg}</div></div>`}
(async function init(){
  if(SUPABASE_URL.startsWith('YOUR_')||SUPABASE_KEY.startsWith('YOUR_')){
    fatal('Paste your Supabase project URL and anon key at the top of the script in <code>index.html</code>, and run <code>scrambler-schema.sql</code> in the Supabase SQL editor.');return;
  }
  if(!window.supabase){fatal('Could not load the Supabase library. Check your connection and reload.');return}
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{db:{schema:'scrambler'},auth:{persistSession:true,autoRefreshToken:true}});
  let {data:{session}}=await sb.auth.getSession();
  if(!session){
    const r=await sb.auth.signInAnonymously();
    if(r.error){fatal('Anonymous sign-in failed: '+esc(r.error.message)+'. Enable "Allow anonymous sign-ins" in Supabase Authentication settings.');return}
    session=r.data.session;
  }
  pendingCode=cleanCode(new URLSearchParams(location.search).get('t'));
  let w=null;
  try{w=await rpc('whoami')}catch(e){fatal('Could not reach the scrambler schema. Did you run <code>scrambler-schema.sql</code> and expose the <code>scrambler</code> schema?');return}
  if(!w){view='auth';render();return}
  prof={id:w.profile_id,username:w.username};
  const last=ls.get('pb_last');
  if(last&&!pendingCode){
    if(await openT(last)&&T.status!=='done')return;
    if(T){unsubscribe();T=null}
  }
  await loadMine();view='home';render();
})();
</script></body></html>
