/* ---------- payouts + schedule ---------- */
/* Payouts: 1st gets half the pot and the last paid place gets exactly its entry fee back. The other places
   share what's left, stepping down evenly. Places paid: 3 for 4-7 players, 4 for 8-13, 5 for 14-16.
   Amounts are whole units of the fee's smallest step ($1 for whole-dollar fees) and always add up to the pot. */
function payoutPlaces(n){return n<=7?3:n<=13?4:5}
/* 4-player series: only first and second are paid. First gets 65% of the pot rounded down to a whole unit of the fee
   ($1 for whole-dollar fees), second gets the rest, so second never drops below 35% and first never goes above 65%. */
function payoutsSeries(n,fee){
  const u=[1,.5,.25,.1,.05,.01].find(x=>Math.abs(fee/x-Math.round(fee/x))<1e-6)||.01;
  const P=Math.round(n*fee/u),first=Math.floor(P*0.65);
  return [first*u,(P-first)*u];
}
function payoutsFor(n,fee){return isSeries()?payoutsSeries(n,fee):payouts(n,fee)}
function payouts(n,fee){
  const u=[1,.5,.25,.1,.05,.01].find(x=>Math.abs(fee/x-Math.round(fee/x))<1e-6)||.01;
  const f=Math.round(fee/u),P=n*f,first=Math.round(P/2);
  let k=payoutPlaces(n);
  while(k>2&&P-first-(k-1)*f<0)k--;
  const m=k-1,E=P-first-m*f,ex=Array(m).fill(0);
  if(m===1)ex[0]=E;
  else{
    const w=Array.from({length:m},(_,j)=>m-1-j),sum=w.reduce((x,y)=>x+y,0);
    const ideal=w.map(x=>E*x/sum);
    ideal.forEach((v,i)=>ex[i]=Math.floor(v+1e-9));
    let left=E-ex.reduce((x,y)=>x+y,0);
    const order=ideal.map((_,i)=>i).sort((x,y)=>(ideal[y]-ex[y])-(ideal[x]-ex[x])||x-y);
    for(let j=0;left>0;j++,left--)ex[order[j%order.length]]++;
  }
  return [first,...ex.map(e=>f+e)].map(x=>Math.round(x*u*100)/100).sort((x,y)=>y-x);
}
/* Courts: the games in a round are played at the same time, one per court (court = position in the round).
   Reorder each round's games so nobody gets stuck on one court: pick the order that repeats courts least. */
function assignCourts(rounds,n){
  const seen=Array.from({length:n},()=>({}));
  const perms=a=>a.length<2?[a]:a.flatMap((x,i)=>perms([...a.slice(0,i),...a.slice(i+1)]).map(p=>[x,...p]));
  return rounds.map(R=>{
    let best=null,bs=1e9;
    for(const p of perms(R.map((_,i)=>i))){
      let c=0;
      p.forEach((mi,court)=>[...R[mi].a,...R[mi].b].forEach(x=>{c+=(seen[x][court]||0)**2}));
      c+=Math.random()*0.01;
      if(c<bs){bs=c;best=p}
    }
    const out=best.map(i=>R[i]);
    out.forEach((m,court)=>[...m.a,...m.b].forEach(x=>{seen[x][court]=(seen[x][court]||0)+1}));
    return out;
  });
}
function genSchedule(n,R){
  const b=n%4;               // players sitting out each round
  for(let limit=2;limit<=4;limit++){
    const tries=limit==2?400:300;
    for(let attempt=0;attempt<tries;attempt++){
      const partner=new Set(),opp={},byeCnt=Array(n).fill(0),rounds=[];let ok=true;
      for(let r=0;r<R&&ok;r++){
        let found=null;
        for(let t=0;t<150&&!found;t++){
          let byes=[];
          if(b>0)byes=shuf([...Array(n).keys()]).sort((x,y)=>byeCnt[x]-byeCnt[y]).slice(0,b);
          const pool=shuf([...Array(n).keys()].filter(i=>!byes.includes(i))),teams=[];let bad=false;
          while(pool.length){
            const a=pool.shift();
            const idx=pool.findIndex(c=>!partner.has(a+'-'+c)&&!partner.has(c+'-'+a));
            if(idx<0){bad=true;break}
            teams.push([a,pool.splice(idx,1)[0]]);
          }
          if(bad)continue;
          const ts=shuf(teams),matches=[],cnt={};let good=true;
          for(let i=0;i<ts.length;i+=2){
            for(const x of ts[i])for(const y of ts[i+1]){
              const k1=x+'-'+y;
              if(((opp[k1]||0)+(cnt[k1]||0))>=limit)good=false;
              cnt[k1]=(cnt[k1]||0)+1;cnt[y+'-'+x]=(cnt[y+'-'+x]||0)+1;
            }
            matches.push({a:ts[i],b:ts[i+1],sa:'',sb:''});
          }
          if(good)found={matches,teams,cnt,byes};
        }
        if(!found){ok=false;break}
        found.teams.forEach(([x,y])=>{partner.add(x+'-'+y);partner.add(y+'-'+x)});
        for(const k in found.cnt)opp[k]=(opp[k]||0)+found.cnt[k];
        found.byes.forEach(i=>byeCnt[i]++);
        rounds.push(found.matches);
      }
      if(ok)return assignCourts(rounds,n);
    }
  }
  return null;
}

/* Rounds that give every player the same number of games (sit-outs rotate evenly). */
const gamesEach=(n,r)=>r*(n-n%4)/n;
function roundChoices(n){
  const b=n%4,out=[];
  for(let r=2;r<=n;r++){
    if(b&&(b*r)%n)continue;
    if(gamesEach(n,r)>n-1)continue;   // can't have more distinct partners than other players
    out.push(r);
  }
  const d=defaultRounds(n);
  return out.filter(r=>r<=Math.max(7,d));
}
function defaultRounds(n){
  if(n%4===0)return n===4?3:n/2;
  for(let r=3;r<=n;r++)if((n%4*r)%n===0)return r;
  return n;
}
/* 4-player series: every pair of partners once, in random order, as three best-of-3 series. Each game is its own round
   (one court). The first two games of each series are scheduled; the server adds game 3 only if they split 1-1. */
function genSeries(){
  const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const [p,q,r,t]=sh([0,1,2,3]);
  const pairs=sh([[[p,q],[r,t]],[[p,r],[q,t]],[[p,t],[q,r]]]).map(([x,y])=>Math.random()<.5?[x,y]:[y,x]);
  const out=[];pairs.forEach(([a,b],k)=>[1,2].forEach(g=>out.push([{a,b,sa:'',sb:'',s:k+1,g}])));
  return out;
}
function seriesState(sn){   /* wins for the a side and the b side of series sn, and who has clinched it */
  let wa=0,wb=0,m0=null;
  T.rounds.forEach(r=>r.forEach(m=>{if(m.s!==sn)return;m0=m0||m;if(!filled(m))return;if(+m.sa>+m.sb)wa++;else if(+m.sb>+m.sa)wb++}));
  return {wa,wb,m0,win:wa>=2?'a':wb>=2?'b':null};
}
/* Official player swaps. A swap hands a player's unscored games to a new player (a new position in players/pids). For the
   standings the two share one seat: points and wins from both count together, the seat shows the current player and the
   entry fee stays with the seat. Ratings are separate: each game is rated for whoever actually played it. */
const swapList=()=>Array.isArray(T?.swaps)?T.swaps:[];
const seatOf=i=>{let k=i,w;while((w=swapList().find(x=>x.in===k)))k=w.out;return k};
const occupantOf=k=>{let w;while((w=swapList().find(x=>x.out===k)))k=w.in;return k};
const occupantAt=(k,ri)=>{let w;while((w=swapList().find(x=>x.out===k&&x.round<=ri)))k=w.in;return k};
const seatCount=()=>T.players.length-swapList().length;
function seatRows(s){
  return s.filter((_,k)=>!swapList().some(w=>w.in===k)).map(r=>{
    const o=occupantOf(r.i),was=[];let k=r.i;while(k!==o){was.push(T.players[k]);k=swapList().find(x=>x.out===k).in}
    return {...r,i:o,n:T.players[o],was};

}
function standingsSeries(){
  const s=T.players.map((n,i)=>({i,n,pf:0,pa:0,g:0,gw:0,sw:0}));
  T.rounds.forEach(r=>r.forEach(m=>{
    if(!filled(m))return;
    const aw=+m.sa>+m.sb;
    m.a.forEach(i=>{const q=s[seatOf(i)];q.pf+=+m.sa;q.pa+=+m.sb;q.g++;if(aw)q.gw++});
    m.b.forEach(i=>{const q=s[seatOf(i)];q.pf+=+m.sb;q.pa+=+m.sa;q.g++;if(!aw)q.gw++});
  }));
  [1,2,3].forEach(n=>{const st=seriesState(n);if(st.win&&st.m0)st.m0[st.win].forEach(i=>s[seatOf(i)].sw++)});
  return seatRows(s).sort((x,y)=>y.sw-x.sw||y.gw-x.gw);

/* League: teams are ranked by wins, then head-to-head among the teams still level, then point differential. Teams level on all
   three share the place. rows: {k, gw, g, pf, pa}; ms: the scored games as {a, b, sa, sb} with team keys. */
function rankTeams(rows,ms){
  rows.forEach(r=>{r.d=r.pf-r.pa;r.h=0});
  const srt=rows.slice().sort((x,y)=>y.gw-x.gw),out=[];
  for(let i=0;i<srt.length;){
    let j=i+1;while(j<srt.length&&srt[j].gw===srt[i].gw)j++;
    const grp=srt.slice(i,j);
    if(grp.length>1){
      const ids=new Set(grp.map(r=>r.k));
      ms.forEach(m=>{if(ids.has(m.a)&&ids.has(m.b)&&m.sa!==m.sb)grp.find(r=>r.k===(m.sa>m.sb?m.a:m.b)).h++});
      grp.sort((x,y)=>y.h-x.h||y.d-x.d||y.pf-x.pf);
    }
    out.push(...grp);i=j;
  }
  out.forEach((r,ix)=>{const q=out[ix-1];if(q&&q.gw===r.gw&&q.h===r.h&&q.d===r.d){r.pl=q.pl;r.tie=true;q.tie=true}else{r.pl=ix+1;r.tie=false}});

/* team table of one league night, from the schedule (a seat = a team member's spot; a sub shares the seat of who they replaced) */
function standingsLeague(){
  const nt=(T.players.length-swapList().length)/2;
  const rows=Array.from({length:nt},(_,k)=>({k,i:2*k,pf:0,pa:0,g:0,gw:0})),ms=[];
  T.rounds.forEach(R=>R.forEach(m=>{
    if(!filled(m))return;
    const a=Math.floor(seatOf(m.a[0])/2),b=Math.floor(seatOf(m.b[0])/2),sa=+m.sa,sb=+m.sb;
    rows[a].pf+=sa;rows[a].pa+=sb;rows[a].g++;rows[b].pf+=sb;rows[b].pa+=sa;rows[b].g++;
    if(sa>sb)rows[a].gw++;else if(sb>sa)rows[b].gw++;
    ms.push({a,b,sa,sb});
  }));
  const out=rankTeams(rows,ms);
  out.forEach(r=>{const x=occupantOf(2*r.k),y=occupantOf(2*r.k+1);r.n=[x,y].map(i=>shortN(T.players[i])).join(' & ');r.ps=[x,y].map(i=>T.pids?.[i]).filter(Boolean);r.mine=!!prof&&r.ps.includes(prof.id)});

}

/* Ties: players level on the main score (points, or series won in a series) and on total games won share a place.
   Their prize money is pooled and split evenly in whole units of the fee. Any leftover unit goes by a random draw
   that is seeded by the event and the tied players, so every phone shows the same winner of the draw. */
function sameRank(x,y){return isSeries()?x.sw===y.sw&&x.gw===y.gw:x.pf===y.pf&&x.gw===y.gw}
function seedRand(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296}}

function placed(st,pay){
  const fee=+T.fee||0,u=feeUnit();
  const out=st.map(x=>({...x,pl:0,tie:false,pay:0,odd:false}));
  let a=0;
  while(a<out.length){
    let b=a+1;while(b<out.length&&sameRank(out[a],out[b]))b++;
    const m=b-a,pool=Math.round(pay.slice(a,b).reduce((q,v)=>q+v,0)/u);
    const rnd=seedRand((T.id||T.code||'')+'|'+out.slice(a,b).map(x=>x.i).sort((q,r)=>q-r).join(','));
    const order=out.slice(a,b).map((_,k)=>k).map(k=>[rnd(),k]).sort((q,r)=>q[0]-r[0]).map(q=>q[1]);
    /* nobody is paid less than the entry fee: the pool goes to as many tied players as it can pay at least the fee,
       chosen by the draw, and is split evenly among them (leftover units also by the draw) */
    const fu=Math.max(1,Math.round(fee/u)),w=pool<=0?0:Math.max(1,Math.min(m,Math.floor(pool/fu)));
    for(let k=0;k<m;k++){const e=out[a+k];e.pl=a+1;e.tie=m>1;e.drew=pool>0&&w<m}
    if(w){const base=Math.floor(pool/w),extra=pool-base*w;
      for(let k=0;k<w;k++){const e=out[a+order[k]];e.pay=Math.round((base+(k<extra?1:0))*u*100)/100;e.odd=k<extra&&extra>0&&w>1}}
    a=b;

}

  const N=17+4*ver;const M=Array.from({length:N},()=>new Array(N).fill(0));const F=Array.from({length:N},()=>new Array(N).fill(false));
  const set=(r,c,v)=>{M[r][c]=v?1:0;F[r][c]=true};
  const finder=(r0,c0)=>{for(let r=-1;r<=7;r++)for(let c=-1;c<=7;c++){const rr=r0+r,cc=c0+c;if(rr<0||cc<0||rr>=N||cc>=N)continue;const on=r>=0&&r<=6&&c>=0&&c<=6&&(r==0||r==6||c==0||c==6||(r>=2&&r<=4&&c>=2&&c<=4));set(rr,cc,on)}};

  let bi=0;

    for(let r=0;r<N-1;r++)for(let c=0;c<N-1;c++){const v=A[r][c];if(v==A[r][c+1]&&v==A[r+1][c]&&v==A[r+1][c+1])p+=3}

/* An SVG of the code with the 4-module quiet zone, black on white. */
function qrSVG(text,px){
  const A=qrMatrix(text);if(!A)return '';const N=A.length,Q=4;let d='';
  for(let r=0;r<N;r++){let c=0;while(c<N){if(A[r][c]){let e=c;while(e<N&&A[r][e])e++;d+=`M${c+Q} ${r+Q}h${e-c}v1h${-(e-c)}z`;c=e}else c++}}
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${N+2*Q} ${N+2*Q}" width="${px||200}" height="${px||200}" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}


/* ---------- my stats (from finished events) ---------- */
function myResults(){
  return mine.filter(t=>t.status==='done'&&!isFree(t)&&t.money!==false&&Array.isArray(t.result)).map(t=>{
    const i=t.result.findIndex(x=>x.p===prof.id);
    return i<0?null:{t,rank:t.result[i].pl||i+1,n:t.result.length,fee:+t.fee,pay:+t.result[i].pay||0};
  }).filter(Boolean);
}
function statsHTML(){
  const rs=myResults();if(!rs.length)return '';
  const spent=rs.reduce((a,r)=>a+r.fee,0),won=rs.reduce((a,r)=>a+r.pay,0),net=won-spent;
  const roi=spent?Math.round(net/spent*100):0;
  const avg=(rs.reduce((a,r)=>a+r.rank,0)/rs.length).toFixed(1);
  const firsts=rs.filter(r=>r.rank===1).length,cashed=rs.filter(r=>r.pay>0).length;
  const tile=(b,s,c='')=>`<div class="stat"><b class="${c}">${b}</b><span>${s}</span></div>`;
  return `<div class="card"><h2>Your record</h2><div class="stats">
    ${tile(rs.length,'Played')}${tile(firsts,'1st places')}${tile(avg,'Avg finish')}
    ${tile($$(spent),'Spent')}${tile($$(won),'Won')}${tile(money(net),'Net · '+(roi>0?'+':'')+roi+'% ROI',cls(net))}
  </div><div class="note">Cashed in ${cashed} of ${rs.length}. Finished events only.</div></div>`;
}

/* "What's next for you": one line per event you are in, most urgent first. p: 1 = you are needed now, 5 = just waiting. */
function todoList(){
  if(!prof)return [];
  const it=[];
  const nm=(t,a)=>a.map(i=>esc(t.players[i])).join(' &amp; ');
  const when=t=>[t.starts_at?'📅 '+esc(fmtWhen(t.starts_at)):'',t.location?'📍 '+esc(t.location):''].filter(Boolean).join(' · ');

    const mem=actMem[t.id]||[],my=mem.find(x=>x.profile_id===prof.id),ok=mem.filter(x=>x.approved).length,wait=mem.length-ok;

      else add(5,'⏳',"You're in. Waiting for the director to start",when(t)||'You will see your court here as soon as the first round starts.','Open event');

      if(g)add(1,'🏓',`Your game is on${g.court?' (court '+g.court+')':''}`,`${(g.a||[]).map(q=>esc(q.n)).join(' &amp; ')} vs ${(g.b||[]).map(q=>esc(q.n)).join(' &amp; ')}`,'Enter score');
      else if(adm&&isOP(t))add(4,'🏓','Open play is live','Review and approve finished games, then close the event when play is over.','Open');

      return;
    }
    if(!t.rounds||!t.pids){add(5,'🏓','In progress','','Open event');return}
    const cr=t.current_round,R=t.rounds[cr-1]||[],me=t.pids.indexOf(prof.id),ser=t.format==='series';
    const lab=m=>ser&&m.s?`Series ${m.s} · Game ${m.g}`:`Round ${cr}`;

    if(me>=0){
      const j=R.findIndex(m=>m.a.includes(me)||m.b.includes(me)),m=j>=0?R[j]:null;
      if(m&&!filled(m)){
        const mine_=m.a.includes(me)?m.a:m.b,opp=m.a.includes(me)?m.b:m.a,pt=mine_.filter(i=>i!==me);
        it.push({p:1,id:t.id,icon:'📍',title,court:R.length>1?'Court '+(j+1):'',h:lab(m),sub:`${pt.length?'with '+nm(t,pt)+' · ':''}vs ${nm(t,opp)}`,b:'Enter score',go:'score'});
      }else if(m){
        const left=R.filter(g=>!filled(g)).length;
        if(!(adm&&done&&last))add(4,'✓','Your score is in',left?`Waiting for ${left} other game${left==1?'':'s'}. The next ${ser?'game':'round'} starts by itself.`:'All scores are in.','Open event');
      }else{
        let nx=null;for(let ri=cr;ri<t.rounds.length&&!nx;ri++){const jj=t.rounds[ri].findIndex(g=>g.a.includes(me)||g.b.includes(me));if(jj>=0)nx={ri,jj,g:t.rounds[ri][jj]}}
        const sub=nx?`Next: ${nx.g.s?`Series ${nx.g.s} · Game ${nx.g.g}`:'Round '+(nx.ri+1)}${t.rounds[nx.ri].length>1?' · Court '+(nx.jj+1):''} · ${nm(t,nx.g.a.includes(me)?nx.g.a.filter(i=>i!==me):nx.g.a)||'you'} ${nx.g.a.includes(me)?'':'vs '}${nx.g.a.includes(me)?'vs '+nm(t,nx.g.b):nm(t,nx.g.b)}`:'No more games for you in this event.';
        add(3,'🪑',`You sit out this ${ser?'game':'round'}`,sub,'Open event');
      }
    }else if(!(adm&&done&&last))add(4,'⏱',`${ser?'Game':'Round'} ${cr} in progress`,`${R.filter(filled).length} of ${R.length} score${R.length==1?'':'s'} in.`,'Open event');
  });
  return it.sort((a,b)=>a.p-b.p);
}
function todoHTML(){
  const it=todoList();if(!it.length)return '';
  return `<div class="card todo"><h2><span aria-hidden="true">🎯</span> What's next for you</h2>`+it.map(x=>`<div class="mybn${x.p<=2?'':' quiet'}"><div class="k">${x.title}</div>${x.court?`<div class="court">${x.court}</div>`:''}<div class="v">${x.icon&&!x.court?`<span aria-hidden="true">${x.icon}</span> `:''}${x.h}</div>${x.sub?`<div class="nx" style="margin-top:2px">${x.sub}</div>`:''}<button class="${x.p<=2?'':'sec'}" data-act="todo" data-id="${x.id}" data-go="${x.go||''}">${x.b==='Enter score'?'<span aria-hidden="true">✏️</span> ':''}${x.b}</button></div>`).join('')+`</div>`;
}
function homeHTML(){
  const live=mine.filter(t=>t.status==='playing'),past=mine.filter(t=>t.status==='done');
  /* not started yet: soonest planned start first, events without a planned time after those, newest first */
  const soon=mine.filter(t=>t.status==='lobby').sort((a,b)=>(a.starts_at?0:1)-(b.starts_at?0:1)||(a.starts_at&&b.starts_at?new Date(a.starts_at)-new Date(b.starts_at):new Date(b.created_at)-new Date(a.created_at)));
  let h=`<div class="hdr"><h1>${LOGO}Pickleball Scrambler</h1>
    <button class="pbtn" data-act="dopen" data-d="profile" aria-label="Your profile"><span class="avatar">${avatarInit()}${canSetStart()&&prof.start==null?'<span class="dot" title="You can set your starting rating"></span>':''}</span><span>Profile</span></button></div>`;
  if(needsName()){
    h+=`<div class="card wide" style="border-color:var(--ac)"><h2 style="margin:0 0 4px"><span aria-hidden="true">👋</span> Add your full name</h2>
      <div class="note" style="margin-top:0">Right now other players only see <b>${esc(prof.username)}</b>. A full name helps the director and your partners know who you are. Your username stays your login.</div>
      <div class="row sp" style="margin-top:8px"><button data-act="dopen" data-d="pedit" data-focus="pdn">Add my name</button><button class="sec" data-act="namelater">Later</button></div></div>`;
  }
  if(pendingCode){
    h+=`<div class="card"><h2>You're invited 🎉</h2>
      <div class="code">${esc(pendingCode)}</div>
      <input id="code" type="hidden" value="${esc(pendingCode)}">
      <button data-act="join">Join as ${esc(myName())}</button>${pendingTeam?'<div class="note" style="text-align:center">You will be put on your partner\'s team.</div>':''}
      <div style="text-align:center;margin-top:8px"><button class="del" data-act="noinvite">Not this one? Go back</button></div></div>`;
  }
  const comm=trendingHTML()+feedHTML()+nearbyHTML();
  const tab=pendingCode?'home':homeTab;
  if(!pendingCode)h+=`<div class="tabs" role="tablist" style="margin-top:4px">
    <button class="${tab==='home'?'on':''}" role="tab" data-act="htab" data-v="home"><span aria-hidden="true">🏠</span> Home</button>
    <button class="${tab==='community'?'on':''}" role="tab" data-act="htab" data-v="community"><span aria-hidden="true">👥</span> Community${nearPrompt()?' <span class="dot-inline" title="Finish your profile"></span>':''}</button></div>`;
  if(tab==='community'){
    h+=comm||`<div class="card"><h2>Community</h2><div class="note" style="margin-top:0">Nothing here yet. Players who climb the ratings, events starting around the club and players near you will show up here.</div></div>`;
    if(!pendingCode)h+=`<button class="fab" data-act="dopen" data-d="plus" aria-label="Start or join an event"><span aria-hidden="true">＋</span> Event</button><div style="height:76px"></div>`;
    return h;
  }
  h+=todoHTML();
  if(leagues.length)h+=`<div class="card"><h2><span aria-hidden="true">🏆</span> Leagues</h2>${leagues.map(t=>`<div class="tl" data-act="open" data-id="${t.id}"><div><b>${t.name?esc(t.name):'League'}</b> <span>· ${t.nights||''} night${t.nights==1?'':'s'}${t.admin_id===prof.id?' · director':''}</span>${t.status!=='done'&&t.starts_at?`<div class="note" style="margin:1px 0 0">📅 ${esc(fmtWhen(t.starts_at))}${t.location?' · 📍 '+esc(t.location):''}</div>`:''}</div><span style="text-align:right">${t.status==='lobby'?'Forming teams':t.status==='playing'?'In season':'Finished'} ›</span></div>`).join('')}</div>`;
  if(live.length)h+=`<div class="card live"><h2><span class="pulse"></span>Live now</h2>${live.map(tlRow).join('')}</div>`;
  if(soon.length)h+=`<div class="card"><h2><span aria-hidden="true">📅</span> Upcoming events</h2>${soon.map(tlRow).join('')}</div>`;
  h+=boardCardHTML();
  if(past.length){
    const shown=showAllPast?past:past.slice(0,8);
    h+=`<div class="card"><h2>Past events</h2>${shown.map(tlRow).join('')}${past.length>8?`<div style="text-align:center;margin-top:8px"><button class="del" data-act="pastall"><span aria-hidden="true">📜</span> ${showAllPast?'Show fewer':'Show all '+past.length}</button></div>`:''}</div>`;
  }
  if(!mine.length&&!leagues.length&&!pendingCode)h+=`<div class="card"><h2>Welcome 👋</h2><div class="note" style="margin-top:0">Playing with friends tonight? Join their event with the 5-letter code, or set one up yourself.</div>
    <div class="row" style="margin-top:10px"><button data-act="dopen" data-d="plus" data-focus="code"><span aria-hidden="true">🔑</span> Join with a code</button><button class="sec" data-act="dopen" data-d="plus"><span aria-hidden="true">➕</span> Start an event</button></div></div>`;
  if(!pendingCode)h+=`<button class="fab" data-act="dopen" data-d="plus" aria-label="Start or join an event"><span aria-hidden="true">＋</span> Event</button><div style="height:76px"></div>`;
  return h;
}

/* the "Finish your profile" nudge: offered only once someone has finished an event, never during first-run */
function nearPrompt(){return !!prof&&!prof.pub&&ls.get('pb_nonear')!=='1'&&mine.some(t=>t.status==='done')}
function nearbyHTML(){
  if(!prof)return '';
  if(!prof.pub){
    if(!nearPrompt())return '';
    const missing=[!prof.display&&'a display name',!prof.city&&'your city and state',!prof.email&&'a recovery email'].filter(Boolean);
    const list=missing.length>1?missing.slice(0,-1).join(', ')+' and '+missing.slice(-1):missing[0];
    const body=missing.length?`Nice first game! Add ${list} if you like. All optional, and your location is only shared if you choose.`:'Turn on <b>Let players in my state find me</b> to see other players near you.';
    return `<div class="card"><h2>Finish your profile</h2><div class="note" style="margin-top:0">${body}</div><div class="row" style="margin-top:8px"><button class="sec sm" data-act="dopen" data-d="${missing.length?'profile':'pedit'}">${missing.length?'Add details':'Open settings'}</button><button class="del" data-act="nonear" style="flex:0 0 auto">Not now</button></div></div>`;
  }
  const row=x=>`<div class="tl" data-act="player" data-u="${esc(x.pid)}"><div><b>${esc(dn(x))}</b>${x.same_city?'<span class="badge">your city</span>':''}<div class="note" style="margin:1px 0 0">${esc(x.city)}, ${esc(x.state)}${x.last_played?' · played '+ago(x.last_played):' · new'}</div></div><span style="white-space:nowrap">${x.games>0?'<b>'+(+x.rating).toFixed(2)+'</b> ':''}›</span></div>`;
  return `<div class="card"><h2>Players near you <span class="note" style="font-weight:400">· ${esc(prof.state)}</span></h2>${nearby.length?nearby.map(row).join(''):'<div class="note" style="margin-top:0">Nobody else in your state has shared a location yet. Invite friends. They can turn on sharing in their profile.</div>'}</div>`;
}
const ago=d=>{const m=Math.round((Date.now()-new Date(d))/60000);if(m<2)return 'just now';if(m<60)return m+' min ago';const h=Math.round(m/60);if(h<24)return h+' hr ago';const dd=Math.round(h/24);return dd===1?'yesterday':dd+' days ago'};
function feedHTML(){
  if(!feed.length)return '';
  const row=x=>{
    const fmt=fmtName(x),live=x.status!=='done',pl=`${x.players} player${x.players==1?'':'s'}`;
    const pre=x.name?fmt+' · ':'',sub=live?`${pre}${esc(x.host)} ${x.status==='lobby'?'is gathering players':'is hosting'} · ${pl}${x.starts_at?' · 📅 '+esc(fmtWhen(x.starts_at)):''}${x.location?' · 📍 '+esc(x.location):''}`:`${pre}${pl}${x.winner?` · 🏆 ${esc(x.winner)}`:''} · hosted by ${esc(x.host)}`;
    const when=live?(x.status==='lobby'?'Lobby':(isFree(x)?'Live':x.format==='series'?`Game ${x.round}`:`Round ${x.round}${x.total_rounds?' of '+x.total_rounds:''}`)):ago(x.at);
    return `<div class="tl" data-act="feedopen" data-id="${x.id}" data-mine="${x.mine?1:0}"><div><b>${x.name?esc(x.name):fmt}</b>${x.mine?'<span class="badge">you</span>':''}<div class="note" style="margin:1px 0 0">${sub}</div></div><span style="white-space:nowrap;flex:none">${live?'<span class="pulse" style="display:inline-block;margin-right:6px"></span>':''}${when} ›</span></div>`;
  };
  return `<div class="card"><h2>Around the club</h2>${feed.map(row).join('')}</div>`;
}

/* ----- dialogs (profile, plus) ----- */
function renderModal(){
  const m=$('modal');if(!m)return;
  if(!dlg||!prof){m.innerHTML='';document.body.classList.remove('noscroll');return}
  document.body.classList.add('noscroll');
  m.innerHTML=`<div id="modalbd"><div class="sheet" role="dialog" aria-modal="true">${dlg==='profile'?profileDlgHTML():dlg==='pedit'?peditDlgHTML():dlg==='pemail'?pemailDlgHTML():dlg==='ppin'?ppinDlgHTML():dlg==='event'&&evt?eventDlgHTML():dlg==='player'&&plyr?playerDlgHTML():dlg==='qr'&&T?qrDlgHTML():dlg==='swap'&&T?swapDlgHTML():dlg==='report'&&T?reportDlgHTML():plusDlgHTML()}</div></div>`;
}
/* ---------- reports: the results of an event or a league, to copy as text or print / save as PDF ---------- */
const signed=d=>(d>0?'+':'')+d;
const plainLines=html=>{const d=document.createElement('div');d.innerHTML=html;const k=[...d.children].map(e=>e.textContent.replace(/\s+/g,' ').trim()).filter(Boolean);return k.length?k:(d.textContent.trim()?[d.textContent.trim()]:[])};
const longDate=d=>new Date(d).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});
function eventReport(){
  const open=isFree(T),lg=isLeagueNight(),sr=isSeries(),c=cash();
  const r=Array.isArray(T.result)?T.result:[],fin=open?games.filter(g=>gDone(g)&&!g.voided).slice().reverse():[];
  const meta=[`${fmtName(T)}${lg&&T.night?' · Night '+T.night:''} · ${typeText(T)}${typeOf(T)==='fun'?' (not rated)':''}`,longDate(T.starts_at||T.created_at)];
  if(T.location)meta.push(T.location);
  meta.push(`${r.length} ${lg?'teams':'players'}${c?` · ${$$(+T.fee*r.length)} pool · entry ${$$(+T.fee)}`:''}${open?` · ${fin.length} games`:''}`);
  if(T.status!=='done')meta.push('In progress: results so far');
  if(T.ended_early)meta.push('Ended early when time ran out. Games that were not played are not on record.');
  const place=(x,i)=>`${x.tie?'T':''}${x.pl||i+1}`,nm=x=>shortN(x.n)+(x.was&&x.was.length?` (for ${x.was.map(shortN).join(', ')})`:'');
  let head,rows;
  if(lg){head=['#','Team','W–L','+/−'];rows=r.map((x,i)=>[place(x,i),nm(x),`${x.gw}–${x.g-x.gw}`,signed(x.d)])}
  else if(open){head=['#','Player','G','W','L','+/−'];rows=r.map((x,i)=>[i+1,nm(x),x.g,x.w,x.l,signed(x.d)])}
  else if(sr){head=['#','Player','Series','Games','+/−',...(c?['Paid']:[])];rows=r.map((x,i)=>[place(x,i),nm(x),x.sw??'',x.gw!=null?x.gw+'–'+(x.g-x.gw):'',signed(x.d),...(c?[x.pay?$$(x.pay):'']:[])])}
  else{head=['#','Player','Wins','Pts','+/−',...(c?['Paid']:[])];rows=r.map((x,i)=>[place(x,i),nm(x),x.gw!=null?x.gw:'',x.pf,signed(x.d),...(c?[x.pay?$$(x.pay):'']:[])])}
  const blocks=[{h:'Results',head,rows}];
  const notes=[...(lg||open?[]:plainLines(tieNotes(r.map(x=>({...x,pl:x.pl||0})),c))),...(open?[]:plainLines(swapNotes()))];
  if(notes.length)blocks.push({h:'Notes',lines:notes});
  if(open){
    blocks.push({h:'Games',lines:fin.map(g=>`${g.a.map(x=>shortN(x.n)).join(' & ')}  ${g.sa} – ${g.sb}  ${g.b.map(x=>shortN(x.n)).join(' & ')}${g.rated?'':' (unrated)'}`)});
  }else if(Array.isArray(T.rounds)){
    const nm2=i=>shortN(T.players?.[i]);
    const lines=[];
    T.rounds.forEach((R,ri)=>{
      lines.push((sr&&R[0]&&R[0].s?`Series ${R[0].s} · Game ${R[0].g}`:'Round '+(ri+1))+':');
      R.forEach((m,j)=>lines.push(`  ${R.length>1?'Court '+(j+1)+': ':''}${m.a.map(nm2).join(' & ')}  ${m.sa===''?'–':m.sa} – ${m.sb===''?'–':m.sb}  ${m.b.map(nm2).join(' & ')}${m.fix?' (corrected)':''}`));
      const bye=byesOf(ri);if(bye.length)lines.push('  Sat out: '+bye.map(nm2).join(', '));
    });
    blocks.push({h:'Games',lines});
  }
  return {title:T.name||fmtName(T),meta,blocks:withNote(blocks)};
}
function leagueReport(){
  const nn=T.nights||LN.length,played=LN.filter(n=>n.status==='done').length,rows=T.status==='lobby'?[]:seasonRows();
  const meta=[`Partner league · ${nn} night${nn==1?'':'s'} · ${typeText(T)}${typeOf(T)==='fun'?' (not rated)':''}`];
  if(T.starts_at)meta.push('Starts '+longDate(T.starts_at));
  if(T.location)meta.push(T.location);
  meta.push(T.status==='lobby'?'Forming teams':`${(T.teams||[]).length} teams · ${played} of ${LN.length} nights finished${T.status==='done'?' · League finished':''}`);
  const blocks=[];
  if(rows.length)blocks.push({h:'Season standings',head:['#','Team','W–L','PF','PA','+/−'],rows:rows.map(x=>[`${x.tie?'T':''}${x.pl}`,x.n,`${x.gw}–${x.g-x.gw}`,x.pf,x.pa,signed(x.d)])});
  LN.forEach(n=>{
    const h=`Night ${n.night}${n.starts_at?' · '+new Date(n.starts_at).toLocaleDateString(undefined,{month:'short',day:'numeric'}):''}${n.ended_early?' (ended early)':''}`;
    if(n.status==='done'&&Array.isArray(n.result)&&n.result.length)blocks.push({h,head:['#','Team','W–L','+/−'],rows:n.result.map((x,i)=>[`${x.tie?'T':''}${x.pl||i+1}`,shortN(x.n),`${x.gw}–${x.g-x.gw}`,signed(x.d)])});
    else blocks.push({h,lines:[n.status==='playing'?`In progress (round ${n.current_round})`:'Not played yet']});
  });
  if((T.teams||[]).length)blocks.push({h:'Teams',lines:T.teams.map(t=>t.n)});
  return {title:T.name||'League',meta,blocks:withNote(blocks)};
}
/* a public director's note goes first on the report; a private one never leaves the director's screen */
const withNote=blocks=>NOTE&&NOTE.is_public?[{h:"Director's note",lines:String(NOTE.note).split(/\n+/).map(x=>x.trim()).filter(Boolean)},...blocks]:blocks;
function noteCard(){
  if(!NOTE)return '';
  const own=isAdmin();if(!NOTE.is_public&&!own)return '';
  return `<div class="card"><div class="top"><h2 style="margin:0"><span aria-hidden="true">📝</span> Director's note</h2>${NOTE.is_public?'':'<span class="badge">🔒 Only you</span>'}</div><div style="white-space:pre-wrap;margin-top:6px">${esc(NOTE.note)}</div></div>`;
}
const currentReport=()=>isLeague()?leagueReport():eventReport();
function reportHTML(R){
  return `<h1>${esc(R.title)}</h1>${R.meta.map(x=>`<div class="rm">${esc(x)}</div>`).join('')}`+R.blocks.map(b=>`<h2 class="rh">${esc(b.h)}</h2>`+
    (b.head?`<table><tr>${b.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`:'')+
    (b.lines||[]).map(l=>`<div class="rl"${/^\s/.test(l)?' style="padding-left:14px"':''}>${esc(l.trim())}</div>`).join('')).join('')+
    `<div class="rf">Pickleball Scrambler · ${new Date().toLocaleDateString()}</div>`;
}
/* plain text for a group chat: one line per row, no columns to line up */
function reportText(R){
  const out=[R.title,...R.meta];
  R.blocks.forEach(b=>{
    out.push('',b.h.toUpperCase());
    if(b.head)b.rows.forEach(r=>out.push(`${r[0]}. ${r[1]}`+(r.length>2?' — '+r.slice(2).map((c,i)=>({'W–L':'','Wins':'Wins ','Pts':'Pts ','Paid':'Paid ','Series':'Series ','Games':'Games ','G':'G ','W':'W ','L':'L ','PF':'PF ','PA':'PA ','+/−':''})[b.head[i+2]]+c).filter((c,i)=>String(r[i+2])!=='').join(' · '):'')));
    (b.lines||[]).forEach(l=>out.push(l));
  });
  return out.join('\n');
}

  <div class="row sp" style="margin:0 0 10px"><button data-act="rcopy"><span aria-hidden="true">📋</span> Copy as text</button>${isOP(T)?'<button data-act="rshare"><span aria-hidden="true">📤</span> Share</button>':''}<button class="sec" data-act="rprint"><span aria-hidden="true">🖨</span> Print / save PDF</button></div>
  ${isAdmin()?`<div class="card"><h2 style="margin-top:0"><span aria-hidden="true">📝</span> Director's note</h2>

    <div class="note" style="margin:0 0 8px">Leave it unchecked to keep the note private. A private note is only shown to you and is left off the report. Clear the box and save to remove a note.</div>
    <button data-act="notesave">Save note</button></div>`:''}
  <div class="card rpt">${reportHTML(R)}</div>`;

function swapDlgHTML(){
  const open=new Set();T.rounds.forEach(r=>r.forEach(m=>{if(!filled(m))[...m.a,...m.b].forEach(i=>open.add(i))}));
  const leaving=[...open].filter(i=>!swapList().some(w=>w.out===i)).sort((a,b)=>a-b);
  const names=new Set(T.players.map(n=>String(n).toLowerCase()));
  const waiting=(M||[]).filter(m=>m.approved&&!names.has(String(m.name).toLowerCase())&&(!m.profile_id||!(T.pids||[]).includes(m.profile_id)));
  return `<div class="top"><h2 style="margin:0;font-size:20px"><span aria-hidden="true">🔁</span> Swap a player</h2><button class="xbtn" data-act="dclose" aria-label="Close"><span aria-hidden="true">✕</span> Close</button></div>
  <div class="card"><div class="note" style="margin-top:0">Use this when someone has to leave. The new player takes over every game that has not been scored yet. Games already played stay with the player who played them, and both players are rated for their own games.</div>
    <label>Who is leaving?</label><select id="swout"><option value="">Choose a player</option>${leaving.map(i=>`<option value="${i}">${esc(T.players[i])}</option>`).join('')}</select>
    <label>Who takes over?</label>
    ${waiting.length?`<select id="swmem"><option value="">Someone already in this event…</option>${waiting.map(m=>`<option value="${esc(m.id)}">${esc(m.name)}</option>`).join('')}</select>`:''}
    <input id="swuser" maxlength="20" autocapitalize="none" autocomplete="off" placeholder="${waiting.length?'…or a':'A'} username (rated)" style="margin-top:8px">
    <input id="swguest" maxlength="30" autocomplete="off" placeholder="…or a guest name (not rated)" style="margin-top:8px">
    <div id="derr" class="err" role="alert" aria-live="polite"></div>
    <button class="sp" data-act="swapok"><span aria-hidden="true">🔁</span> Make the swap</button>
    ${swapList().length?`<div class="note">${swapNotes()}</div>`:''}</div>`;
}
function swapNotes(){
  return swapList().map(w=>`<div>🔁 <b>${esc(T.players[w.in])}</b> took over from <b>${esc(T.players[w.out])}</b> from ${unit().toLowerCase()} ${w.round+1}${w.by?' (by '+esc(w.by)+')':''}.</div>`).join('');
}

    <div class="code">${esc(T.code)}</div>
    <button data-act="share"><span aria-hidden="true">📤</span> Share link instead</button></div>`;
}
function eventDlgHTML(){
  const x=evt,live=x.status!=='done',fmt=fmtName(x)+' · '+typeText(x)+(typeOf(x)==='fun'?' (not rated)':'');
  const state=live?(x.status==='lobby'?'Gathering players':(isFree(x)?'Live now':x.format==='series'?`Game ${x.round}`:`Round ${x.round}${x.total_rounds?' of '+x.total_rounds:''}`)):`Finished ${ago(x.at)}`;
  const names=(x.players||[]).map(n=>`<span class="badge" style="margin:0 6px 6px 0;display:inline-block;font-size:13px;padding:4px 8px">${esc(n)}</span>`).join('');
  let body;

function genLeagueRounds(nt){   /* round robin between nt teams (circle method); team k sits at positions 2k and 2k+1 */
  const ids=shuf([...Array(nt).keys()]);if(nt%2)ids.push(null);
  const m=ids.length,rounds=[];
  for(let r=0;r<m-1;r++){
    const R=[];
    for(let i=0;i<m/2;i++){
      const x=ids[i],y=ids[m-1-i];if(x===null||y===null)continue;
      const [p,q]=Math.random()<.5?[x,y]:[y,x];
      R.push({a:[2*p,2*p+1],b:[2*q,2*q+1],sa:'',sb:''});
    }
    rounds.push(R);ids.splice(1,0,ids.pop());
  }
  return rounds.every(R=>R.length<=6)?assignCourts(rounds,nt*2):rounds;
}

  +(adm?`<div class="row sp"><input id="gname" placeholder="Add a player without a phone" maxlength="30"><button data-act="addguest" style="flex:0 0 80px">Add</button></div>${pinAdd()}`:'')+'</div>';

    st.map((x,i)=>`<tr class="${x.p&&prof&&x.p===prof.id?'me':''}"><td>${i+1}</td><td>${pl(x.n,x.p)}</td><td>${x.g}</td><td>${x.w}</td><td>${x.l}</td><td>${x.pf-x.pa>0?'+':''}${x.pf-x.pa}</td></tr>`).join('')+

/* Events that are not finished come with their schedule, so the dashboard can say what each player has to do next. */
async function loadActive(){
  const cols='id,code,name,starts_at,location,status,current_round,created_at,fee,result,admin_id,kind,money,rated,format,league_id,night,nights,min_players,cap,courts';
  const [a,d]=await Promise.all([
    sb.from('tournaments').select(cols+',rounds,pids,players').neq('status','done').order('created_at',{ascending:false}),
    sb.from('tournaments').select(cols).eq('status','done').order('created_at',{ascending:false}).limit(100)]);
  const every=[...(a.data||[]),...(d.data||[])].sort((x,y)=>new Date(y.created_at)-new Date(x.created_at));
  leagues=every.filter(t=>t.kind==='league');mine=every.filter(t=>t.kind!=='league');   /* a league is a hub for its nights; the nights are the events */
  const ids=(a.data||[]).filter(t=>t.kind!=='league').map(t=>t.id);actMem={};openG=[];
  if(ids.length){
    const [m,g]=await Promise.all([sb.from('members').select('tournament_id,profile_id,approved').in('tournament_id',ids),
      sb.from('games').select('id,tournament_id,a,b,sa,sb,voided').in('tournament_id',ids).is('sa',null)]);
    (m.data||[]).forEach(r=>(actMem[r.tournament_id]=actMem[r.tournament_id]||[]).push(r));
    openG=(g.data||[]).filter(x=>!x.voided);
  }
}

/* The leaderboard, club feed and nearby players do not depend on each other, so they load together.

async function loadExtra(refreshProf){
  if(refreshProf){const w=await sb.rpc('whoami');if(w.data&&prof)Object.assign(prof,setProf(w.data))}   /* first: whether location is public decides if nearby players load */
  const [b,f,n]=await Promise.all([sb.rpc('leaderboard'),sb.rpc('activity'),prof&&prof.pub?sb.rpc('nearby_players'):null]);
  board=Array.isArray(b.data)?b.data:[];feed=Array.isArray(f.data)?f.data:[];
  nearby=n&&Array.isArray(n.data)?n.data:[];

function subscribe(){
  unsubscribe();

    .on('postgres_changes',{event:'*',schema:'scrambler',table:'tournaments',filter:'id=eq.'+T.id},sched)
    .on('postgres_changes',{event:'*',schema:'scrambler',table:'members'},sched)

async function refresh(){
  if(!T||busy)return;busy=true;
  try{
    const {data,error}=await sb.from('tournaments').select('*').eq('id',T.id).maybeSingle();
    if(error)return;
    if(!data){toast("You're no longer in this event");await goHome();return}
    const wasAdmin=isAdmin(),oldCR=T.current_round;
    const oldFix=new Map();(T.rounds||[]).forEach((r,ri)=>r.forEach((m,j)=>{if(m.fix)oldFix.set(ri+'-'+j,m.fix.at)}));
    const oldSwaps=(T.swaps||[]).length;
    T=data;await loadMembers();if(T.status==='done'||T.kind==='league')await loadNote();
    if((T.swaps||[]).length>oldSwaps&&view==='play'){const w=T.swaps[T.swaps.length-1];toast(`🔁 ${T.players[w.in]} now plays for ${T.players[w.out]}`)}
    (T.rounds||[]).forEach((r,ri)=>r.forEach((m,j)=>{if(m.fix&&oldFix.get(ri+'-'+j)!==m.fix.at&&m.fix.by!==prof?.username&&view==='play')toast(`✎ ${m.fix.by} corrected a score: ${[...m.a].map(i=>T.players[i]).join(' & ')} ${m.sa}–${m.sb} ${[...m.b].map(i=>T.players[i]).join(' & ')} (was ${m.fix.was})`)}));if(isFree(T))await loadGames();
    if(T.current_round>oldCR){if(cur===oldCR-1){cur=T.current_round-1;drafts={}}toast(`${unit()} ${T.current_round} has started`)}
    const v=viewFor(T.status);
    if(v!==view||wasAdmin!==isAdmin()){view=v;if(v==='play')cur=Math.min(cur,T.current_round-1);render();return}

    const players=ap.map(m=>m.name),pids=ap.map(m=>m.profile_id),rounds=isSeries()?genSeries():genSchedule(players.length,roundsFor(players.length));
    if(!rounds){toast('Could not build a valid schedule. Try again.');return}
    await rpc('start_tournament',{p_tid:T.id,p_players:players,p_pids:pids,p_rounds:rounds});
    await refresh();
  },
  tab(el){cur=+el.dataset.r;confirmKey='';renderTabs();renderRound()},
  submitedit(){confirmKey='';renderRound()},
  submitok(el){return actions.submit(el)},
  goscore(){cur=T.current_round-1;confirmKey='';renderTabs();renderRound();$('round').scrollIntoView({behavior:'smooth',block:'start'})},
  sinc(el){bump(el,1)},
  sdec(el){bump(el,-1)},
  s11(el){
    const j=el.dataset.m,s=el.dataset.s,o=s==='sa'?'sb':'sa',k=x=>`${cur}-${j}-${x}`;
    drafts[k(s)]='11';if(+(drafts[k(o)]??T.rounds[cur][j][o])>=11||drafts[k(o)]===undefined&&T.rounds[cur][j][o]==='')drafts[k(o)]='';
    renderRound();
    const other=document.querySelector(`#round input[data-m="${j}"][data-s="${o}"]`);if(other&&other.value==='')other.focus();
  },
  async submit(el){
    const j=+el.dataset.m,ri=cur;
    const a=document.querySelector(`#round input[data-m="${j}"][data-s="sa"]`),b=document.querySelector(`#round input[data-m="${j}"][data-s="sb"]`);
    const sa=(a?.value||'').trim(),sb2=(b?.value||'').trim();
    if(!/^\d{1,3}$/.test(sa)||!/^\d{1,3}$/.test(sb2))return toast('Enter both scores');
    if(cash()&&!(Math.max(+sa,+sb2)===11&&Math.min(+sa,+sb2)<=10))return toast('Moneyball games go to 11, win by 1. The winner has 11, the other team 0 to 10.');
    if(isSeries()&&+sa===+sb2)return toast('A game in a series needs a winner (no ties)');
    if(confirmKey!==`${ri}-${j}`){drafts[`${ri}-${j}-sa`]=sa;drafts[`${ri}-${j}-sb`]=sb2;confirmKey=`${ri}-${j}`;renderRound();return}
    confirmKey='';
    await rpc('submit_score',{p_tid:T.id,p_round:ri+1,p_match:j,p_sa:sa,p_sb:sb2});
    delete drafts[`${ri}-${j}-sa`];delete drafts[`${ri}-${j}-sb`];
    const prev=T.rounds[ri][j],was=filled(prev),chg=was&&(+prev.sa!==+sa||+prev.sb!==+sb2);
    T.rounds[ri][j]={...prev,sa:String(+sa),sb:String(+sb2),...(was?{}:{by:prof.username}),...(chg?{fix:{by:prof.username,at:new Date().toISOString(),was:prev.sa+'–'+prev.sb,first:prev.fix?.first||prev.sa+'–'+prev.sb,n:(prev.fix?.n||0)+1}}:{})};
    renderTabs();renderRound();renderCtl();renderStand();toast(chg?'Score corrected. The others in this game can see it.':'Score submitted');
    if(isSeries()||(ri+1===T.current_round&&allIn(T.rounds[ri])))await refresh();
  },
  async nextround(){await rpc('next_round',{p_tid:T.id});await refresh();cur=T.current_round-1;renderPlayBody();window.scrollTo(0,0)},
  endask(){endAsk=true;finAsk=false;renderCtl()},
  endno(){endAsk=false;renderCtl()},
  async endok(){
    endAsk=false;
    const result=resultRows();
    await rpc('end_tournament_early',{p_tid:T.id,p_result:result});
    await refresh();toast('Event closed. Every scored game is on record.');
  },
  async swapok(){
    const out=+$('swout')?.value,mem=$('swmem')?.value||'',user=($('swuser')?.value||'').trim(),guest=($('swguest')?.value||'').trim();
    if(!Number.isInteger(out)||!$('swout')?.value)return derr('Choose who is leaving.','swout');
    if([mem,user,guest].filter(Boolean).length!==1)return derr('Bring in one player: pick someone from the event, or type a username, or type a guest name.');
    try{await rpc('swap_player',{p_tid:T.id,p_out:out,p_member:mem||null,p_user:user||null,p_guest:guest||null},true)}catch(e){return derr(e.friendly)}
    dlg='';renderModal();await refresh();
  },
  finish(){finAsk=true;renderCtl()},
  finishno(){finAsk=false;renderCtl()},
  async finishok(){
    finAsk=false;
    const result=resultRows();
    await rpc('finish_tournament',{p_tid:T.id,p_rounds:T.rounds,p_result:result});
    await refresh();
  },
  del(el){twoTap(el,'Tap again to delete',async()=>{
    try{await rpc('delete_tournament',{p_tid:T.id});await goHome()}catch(e){}
  })}
};
document.addEventListener('click',async e=>{
  if(e.target.id==='modalbd'){dlg='';renderModal();return}
  const el=e.target.closest('[data-act]');if(!el||!actions[el.dataset.act])return;
  const act=el.dataset.act,lock=el.tagName==='BUTTON'&&!['del','tab','share','mode','fmt','mon','gend','gedit','opclose','rshare','opstartx','board','dopen','dclose','pastall','lgbegin','lgend','lgshare','rcopy','rprint','notesave'].includes(act);
  if(lock)el.disabled=true;
  try{await actions[act](el)}catch(err){console.error(err)}
  if(lock&&el.isConnected)el.disabled=false;
  if(act==='start')updateNote();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.closest&&t.closest('#app')&&$('autherr')&&t.tagName==='INPUT'){$('autherr').textContent='';t.classList.remove('bad')}
  if(t.closest&&t.closest('#modal')&&$('derr')){$('derr').textContent='';t.classList.remove('bad')}
  if(t.id==='tname')newName=t.value;
  else if(t.id==='twhen')newWhen=t.value;
  else if(t.id==='twhere')newWhere=t.value;
  else if(t.id==='tnotes')newNotes=t.value;
  else if(t.id==='code')t.value=cleanCode(t.value);
  else if(['pin','pin2','pold','pnew','pnew2','fp','fp2'].includes(t.id))t.value=t.value.replace(/\D/g,'').slice(0,6);
  else if(['fc','emc'].includes(t.id))t.value=t.value.replace(/\D/g,'').slice(0,10);
  else if(t.dataset&&t.dataset.g&&(view==='open'||view==='op'))drafts[`g-${t.dataset.g}-${t.dataset.s}`]=t.value;
  else if(t.dataset&&t.dataset.m!==undefined&&view==='play')drafts[`${cur}-${t.dataset.m}-${t.dataset.s}`]=t.value;
});
document.addEventListener('focusout',()=>{
  setTimeout(()=>{if(needRound&&view==='play'&&!scoreFocused())renderRound();if(needOpen&&view==='open'&&!typing())renderOpen()},80);
});
document.addEventListener('change',async e=>{
  if(e.target.id==='twhen'){newWhen=e.target.value;return}
  if(e.target.id==='tnights'){newNights=+e.target.value||4;return}
  if(e.target.dataset&&e.target.dataset.pair){const v=e.target.value;if(!v)return;try{await rpc('assign_team',{p_tid:T.id,p_a:e.target.dataset.pair,p_b:v})}catch(err){}await refresh();return}
  if(e.target.dataset&&e.target.dataset.slot){pick[e.target.dataset.slot]=e.target.value;return}
  if(e.target.id==='rsel'){chosenR=+e.target.value;updateNote();return}
  if(e.target.id==='fee'&&isAdmin()){
    const v=Math.max(0,Math.min(1000,+e.target.value||0));
    T.fee=v;updateNote();
    try{await rpc('set_fee',{p_tid:T.id,p_fee:v})}catch(err){}
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&dlg){dlg='';renderModal();return}
  if(e.key!=='Enter')return;
  const id=e.target.id;
  if(id==='gname')actions.addguest();
  else if(id==='code')actions.join();
  else if(id==='un'||id==='pin'||id==='pin2'||id==='dupr')actions.auth();
  else if(id==='dupr2')actions.setstart();
  else if(['pdn','pcity'].includes(id))actions.psave();
  else if(['pold','pnew','pnew2'].includes(id))actions.pinsave();
  else if(id==='em')actions.emsend();
  else if(id==='emc')actions.emverify();
  else if(id==='fe')actions.fgsend();
  else if(['fc','fp','fp2'].includes(id))actions.fgverify();
  else if(id==='rname')actions.rensave();
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});

/* ---------- boot ---------- */
function fatal(msg){$('app').innerHTML=TITLE+`<div class="card"><h2>Setup needed</h2><div>${msg}</div></div>`}
(async function init(){
  if(SUPABASE_URL.startsWith('YOUR_')||SUPABASE_KEY.startsWith('YOUR_')){
    fatal('Paste your Supabase project URL and anon key at the top of the script in <code>index.html</code>, and run <code>scrambler-schema.sql</code> in the Supabase SQL editor.');return;
  }
  if(!window.supabase){fatal('Could not load the Supabase library. Check your connection and reload.');return}
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{db:{schema:'scrambler'},auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  const urlCode=cleanCode(new URLSearchParams(location.search).get('t'));
  if(!urlCode&&!ls.get('pb_last'))paintCachedHome();   /* returning player: show the last dashboard now */
  let {data:{session}}=await sb.auth.getSession();
  if(!session){
    const r=await sb.auth.signInAnonymously();
    if(r.error){fatal('Anonymous sign-in failed: '+esc(r.error.message)+'. Enable "Allow anonymous sign-ins" in Supabase Authentication settings.');return}
    session=r.data.session;
  }
  pendingCode=cleanCode(new URLSearchParams(location.search).get('t'));
  pendingTeam=pendingCode?(+new URLSearchParams(location.search).get('team')||0):0;   /* a partner's invite link: ?t=CODE&team=N */
  if(pendingCode&&!ls.get('pb_user'))authMode='new';   /* someone following an invite on a fresh phone is almost always new */
  let w=null;
  try{w=await rpc('whoami')}catch(e){fatal('Could not reach the scrambler schema. Did you run <code>scrambler-schema.sql</code> and expose the <code>scrambler</code> schema?');return}
  if(!w){prof=null;mine=[];ls.del(HOME_KEY);view='auth';render();return}
  prof=setProf(w);
  const last=ls.get('pb_last');
  if(last&&!pendingCode){
    if(await openT(last)&&T.status!=='done')return;
    if(T){unsubscribe();T=null}
  }
  await loadActive();view='home';render();saveHome();   /* the player's own events first ... */
  loadExtra(false).then(()=>{if(view==='home'&&!dlg)render();saveHome()}).catch(()=>{extraReady=true});   /* ... then the leaderboard and feed fill in */
})();
</script></body></html>
