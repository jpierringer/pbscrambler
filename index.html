<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pickleball Scrambler</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scrambler">
<meta name="theme-color" content="#2f7d32">
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1b2418;--mu:#6b7566;--ac:#2f7d32;--ac2:#e8f3e6;--bd:#dde2d8;--gold:#b8860b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141913;--card:#1d241c;--tx:#e8eee4;--mu:#93a08c;--ac:#6cc070;--ac2:#243322;--bd:#2e3a2c;--gold:#e0b84a}}
:root[data-theme="dark"]{--bg:#141913;--card:#1d241c;--tx:#e8eee4;--mu:#93a08c;--ac:#6cc070;--ac2:#243322;--bd:#2e3a2c;--gold:#e0b84a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--mu);font-size:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
input,select{width:100%;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.row{display:flex;gap:10px}.row>*{flex:1}
button{font:inherit;font-weight:600;padding:12px 16px;border:0;border-radius:10px;background:var(--ac);color:#fff;cursor:pointer;width:100%}
button.sec{background:var(--ac2);color:var(--ac)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{width:auto;flex:none;padding:8px 14px;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tabs button.done::after{content:" ✓"}
.match{display:grid;grid-template-columns:1fr 64px;gap:8px 10px;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--bd)}
.match:last-child{border:0;margin:0;padding:0}
.match .vs{grid-column:1/-1;text-align:center;color:var(--mu);font-size:12px;margin:-2px 0}
.match input{text-align:center;font-weight:700;font-size:18px}
.t{font-weight:600}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:12px;color:var(--mu);text-align:right;font-weight:600;padding:4px}
td{padding:8px 4px;text-align:right;border-top:1px solid var(--bd)}
th:first-child,td:first-child{text-align:left}th:nth-child(2),td:nth-child(2){text-align:left}
.pay{color:var(--gold);font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center}
.top button{width:auto;padding:6px 12px;font-size:13px}
.note{font-size:12px;color:var(--mu);margin-top:8px}
.hide{display:none}
#toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;background:var(--tx);color:var(--bg);padding:12px 14px;border-radius:10px;font-size:14px;text-align:center}
details{border-top:1px solid var(--bd);padding:8px 0}details:first-of-type{border:0}
summary{cursor:pointer;font-weight:600}summary span{color:var(--mu);font-weight:400;font-size:13px}
.del{background:none;color:var(--mu);width:auto;padding:4px 0;font-size:12px;font-weight:500;text-decoration:underline}
</style></head><body><main>
<div id="setup">
  <h1 style="display:flex;align-items:center;gap:8px"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><g transform="rotate(-30 14 20)"><rect x="4" y="3" width="19" height="23" rx="8" fill="#2f7d32"/><rect x="11.5" y="25" width="4" height="12" rx="2" fill="#8a5a2b"/></g><circle cx="29" cy="27" r="9" fill="#e5e83a" stroke="#9aa000" stroke-width="1"/><g fill="#9aa000"><circle cx="29" cy="22" r="1.3"/><circle cx="24.5" cy="25" r="1.3"/><circle cx="33.5" cy="25" r="1.3"/><circle cx="29" cy="27" r="1.3"/><circle cx="24.5" cy="30" r="1.3"/><circle cx="33.5" cy="30" r="1.3"/><circle cx="29" cy="32" r="1.3"/></g></svg>Pickleball Scrambler</h1>
  <div class="sub">Random partners each round. No repeat partners, max 2 meetings with any opponent.</div>
  <div class="card">
    <div class="row">
      <div><label>Entry fee ($)</label><input id="fee" type="number" min="0" step="0.5" value="2"></div>
      <div><label>Players</label><select id="np"><option>4</option><option selected>8</option><option>12</option><option>16</option></select></div>
    </div>
    <div class="names" id="names"></div>
    <div class="note" id="payprev"></div>
  </div>
  <button id="start">Start tournament</button>
  <div id="hist"></div>
</div>

<div id="play" class="hide">
  <div class="top"><h1>Tournament</h1><button class="sec" id="reset">New</button></div>
  <div class="sub" id="pool"></div>
  <div class="tabs" id="tabs"></div>
  <div class="card" id="round"></div>
  <div class="card"><h2 id="sh">Standings</h2><table id="st"></table>
    <div class="note">Ranked by total points scored, then point differential. Ties split nothing automatically, so settle ties by hand.</div></div>
  <button id="fin" class="hide" style="margin-bottom:10px">Finish &amp; save to history</button>
  <button class="sec" id="reshuf">Reshuffle teams (before scoring)</button>
</div>
</main>
<div id="toast" class="hide" role="status"></div>
<script>
const $=id=>document.getElementById(id);
let S=null,cur=0;
const KEY='pb_scrambler';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):null}catch(e){return null}}
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function weights(k){
  if(k==4)return[3.5,2,1.5,1];
  return Array.from({length:k},(_,i)=>Math.pow(k-i,1.4));
}
function payouts(n,fee){
  const k=n/2,w=weights(k),sum=w.reduce((a,b)=>a+b,0),pool=n*fee;
  const p=w.map(x=>Math.round(pool*x/sum));
  p[0]+=pool-p.reduce((a,b)=>a+b,0);
  return p;
}
const $$=v=>'$'+(Math.round(v*100)/100);

function genSchedule(n){
  const R=n/2;
  for(let limit=2;limit<=4;limit++){
    for(let attempt=0;attempt<800;attempt++){
      const partner=new Set(),opp={},rounds=[];let ok=true;
      for(let r=0;r<R&&ok;r++){
        let found=null;
        for(let t=0;t<300&&!found;t++){
          const pool=shuf([...Array(n).keys()]),teams=[];let bad=false;
          while(pool.length){
            const a=pool.shift();
            const idx=pool.findIndex(b=>!partner.has(a+'-'+b)&&!partner.has(b+'-'+a));
            if(idx<0){bad=true;break}
            teams.push([a,pool.splice(idx,1)[0]]);
          }
          if(bad)continue;
          const ts=shuf(teams),matches=[],cnt={};let good=true;
          for(let i=0;i<ts.length;i+=2){
            for(const a of ts[i])for(const b of ts[i+1]){
              const k1=a+'-'+b;
              if(((opp[k1]||0)+(cnt[k1]||0))>=limit)good=false;
              cnt[k1]=(cnt[k1]||0)+1;cnt[b+'-'+a]=(cnt[b+'-'+a]||0)+1;
            }
            matches.push({a:ts[i],b:ts[i+1],sa:'',sb:''});
          }
          if(good)found={matches,teams,cnt};
        }
        if(!found){ok=false;break}
        found.teams.forEach(([a,b])=>{partner.add(a+'-'+b);partner.add(b+'-'+a)});
        for(const k in found.cnt)opp[k]=(opp[k]||0)+found.cnt[k];
        rounds.push(found.matches);
      }
      if(ok)return rounds;
    }
  }
  return null;
}

function buildNames(){
  const n=+$('np').value,old=[...document.querySelectorAll('#names input')].map(i=>i.value);
  $('names').innerHTML=Array.from({length:n},(_,i)=>`<input value="${(old[i]||'Player '+(i+1)).replace(/"/g,'&quot;')}" aria-label="Player ${i+1}">`).join('');
  prev();
}
function prev(){
  const n=+$('np').value,f=+$('fee').value||0,p=payouts(n,f);
  $('payprev').textContent=`Pool ${$$(n*f)} · ${n/2} rounds · Payouts: ${p.map((x,i)=>(i+1)+'st '.slice(0,0)+'#'+(i+1)+' '+$$(x)).join(', ')}`;
}
$('np').onchange=buildNames;$('fee').oninput=prev;

$('start').onclick=()=>{
  const names=[...document.querySelectorAll('#names input')].map((i,k)=>i.value.trim()||'Player '+(k+1));
  const n=names.length,rounds=genSchedule(n);
  if(!rounds){toast('Could not build a valid schedule. Try again.');return}
  S={names,fee:+$('fee').value||0,rounds};cur=0;save();show();
};
function toast(t){const e=$('toast');e.textContent=t;e.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hide'),3000)}
function twoTap(btn,label,fn){
  if(btn.dataset.arm){clearTimeout(btn._t);delete btn.dataset.arm;btn.textContent=btn._orig;fn();return}
  btn._orig=btn.textContent;btn.dataset.arm=1;btn.textContent=label;
  btn._t=setTimeout(()=>{delete btn.dataset.arm;btn.textContent=btn._orig},3000);
}
$('reset').onclick=()=>twoTap($('reset'),'Tap again to discard',()=>{S=null;try{localStorage.removeItem(KEY)}catch(e){}show();window.scrollTo(0,0)});
$('reshuf').onclick=()=>{
  if(S.rounds.some(r=>r.some(m=>m.sa!==''||m.sb!=='')))return toast('Scores are already entered. Start a new tournament to reshuffle.');
  const r=genSchedule(S.names.length);if(r){S.rounds=r;save();render()}
};

const team=t=>t.map(i=>S.names[i]).join(' & ');
const filled=m=>m.sa!==''&&m.sb!=='';

function standings(){
  const s=S.names.map((n,i)=>({i,n,pf:0,pa:0}));
  S.rounds.forEach(r=>r.forEach(m=>{
    if(!filled(m))return;
    m.a.forEach(i=>{s[i].pf+=+m.sa;s[i].pa+=+m.sb});
    m.b.forEach(i=>{s[i].pf+=+m.sb;s[i].pa+=+m.sa});
  }));
  return s.sort((x,y)=>y.pf-x.pf||(y.pf-y.pa)-(x.pf-x.pa));
}
function render(){
  const R=S.rounds.length;
  $('tabs').innerHTML=S.rounds.map((r,i)=>`<button class="${i==cur?'on ':''}${r.every(filled)?'done':''}" data-r="${i}">Round ${i+1}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=+b.dataset.r;render()});
  $('round').innerHTML=`<h2>Round ${cur+1} of ${R}</h2>`+S.rounds[cur].map((m,j)=>`
    <div class="match"><div class="t">${team(m.a)}</div><input type="number" inputmode="numeric" min="0" data-m="${j}" data-s="sa" value="${m.sa}" placeholder="0">
    <div class="vs">vs</div>
    <div class="t">${team(m.b)}</div><input type="number" inputmode="numeric" min="0" data-m="${j}" data-s="sb" value="${m.sb}" placeholder="0"></div>`).join('');
  $('round').querySelectorAll('input').forEach(inp=>inp.oninput=()=>{
    S.rounds[cur][+inp.dataset.m][inp.dataset.s]=inp.value;save();renderStand();
    const d=S.rounds.map(r=>r.every(filled));
    $('tabs').querySelectorAll('button').forEach((b,i)=>b.classList.toggle('done',d[i]));
  });
  $('pool').textContent=`Entry ${$$(S.fee)} × ${S.names.length} players = ${$$(S.fee*S.names.length)} pool`;
  renderStand();
}
function renderStand(){
  const st=standings(),p=payouts(S.names.length,S.fee);
  const done=S.rounds.every(r=>r.every(filled));
  $('fin').classList.toggle('hide',!done);
  $('sh').textContent=done?'Final standings':'Standings (projected payouts)';
  $('st').innerHTML='<tr><th>#</th><th>Player</th><th>Pts</th><th>+/−</th><th>Payout</th></tr>'+st.map((x,i)=>`<tr><td>${i+1}</td><td>${x.n}</td><td>${x.pf}</td><td>${x.pf-x.pa>0?'+':''}${x.pf-x.pa}</td><td class="pay">${i<p.length?$$(p[i]):''}</td></tr>`).join('');
}
const HK='pb_history';
function loadH(){try{return JSON.parse(localStorage.getItem(HK))||[]}catch(e){return[]}}
function saveH(h){try{localStorage.setItem(HK,JSON.stringify(h))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderHist(){
  const h=loadH();
  if(!h.length){$('hist').innerHTML='';return}
  const net={};
  h.forEach(t=>t.res.forEach(x=>{const o=net[x.n]=net[x.n]||{n:x.n,g:0,won:0};o.g++;o.won+=x.pay-t.fee}));
  const tot=Object.values(net).sort((a,b)=>b.won-a.won);
  const fmt=v=>(v>0?'+':v<0?'−':'')+$$(Math.abs(v));
  $('hist').innerHTML=`<div class="card" style="margin-top:18px"><h2>All-time net (payouts − entry fees)</h2><table><tr><th>Player</th><th></th><th>Played</th><th>Net</th></tr>`+
    tot.map(o=>`<tr><td>${esc(o.n)}</td><td></td><td>${o.g}</td><td class="${o.won>0?'pay':''}">${fmt(o.won)}</td></tr>`).join('')+`</table></div>
    <div class="card"><h2>Past tournaments</h2>`+
    h.map((t,i)=>{
      const pool=t.fee*t.res.length;
      return `<details><summary>${new Date(t.date).toLocaleDateString()} · 🏆 ${esc(t.res[0].n)} <span>${t.res.length} players · ${$$(pool)} pool</span></summary>
      <table><tr><th>#</th><th>Player</th><th>Pts</th><th>+/−</th><th>Paid</th></tr>`+
      t.res.map((x,j)=>`<tr><td>${j+1}</td><td>${esc(x.n)}</td><td>${x.pf}</td><td>${x.d>0?'+':''}${x.d}</td><td class="pay">${x.pay?$$(x.pay):''}</td></tr>`).join('')+
      `</table><button class="del" data-del="${i}">Delete entry</button></details>`}).reverse().join('')+`</div>`;
}
$('hist').onclick=e=>{
  const b=e.target,d=b.dataset.del;
  if(d!==undefined)twoTap(b,'Tap again to delete',()=>{const h=loadH();h.splice(+d,1);saveH(h);renderHist()});
};
$('fin').onclick=()=>{
  const st=standings(),p=payouts(S.names.length,S.fee),h=loadH();
  h.push({date:new Date().toISOString(),fee:S.fee,res:st.map((x,i)=>({n:x.n,pf:x.pf,d:x.pf-x.pa,pay:i<p.length?p[i]:0}))});
  saveH(h);S=null;try{localStorage.removeItem(KEY)}catch(e){}show();window.scrollTo(0,0);
};
function show(){
  $('setup').classList.toggle('hide',!!S);$('play').classList.toggle('hide',!S);
  if(S)render();else renderHist();
}
S=load();buildNames();show();
</script></body></html>
